<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>מתזמן משימות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --soft: #f8f9fb; --line: #e4e7ec; --line2: #cfd4dc;
  --text: #1b2130; --muted: #5f6b7a; --faint: #8c95a3;
  --accent: #2456d3; --accent-soft: #e9effc; --on-accent: #fff;
  --ok: #0f7b4b; --ok-soft: #e3f5ec; --bad: #b42318; --bad-soft: #fdecea; --gray-soft: #eef0f3;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1218; --panel: #171b23; --soft: #1c212b; --line: #2a303c; --line2: #3a4250;
    --text: #e7eaf0; --muted: #a2aab8; --faint: #7a8392;
    --accent: #5b8cff; --accent-soft: #1d2b4d; --on-accent: #0b1020;
    --ok: #4cc38a; --ok-soft: #12301f; --bad: #ff7b72; --bad-soft: #3a1513; --gray-soft: #232935;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Heebo, "Segoe UI", Arial, sans-serif; }
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 13px; }
.ltr { direction: ltr; text-align: left; }
.hidden { display: none !important; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

header.top { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.top-in { max-width: 1180px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 22px; height: 58px; }
.brand { font-weight: 700; font-size: 17px; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.brand i { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: inline-block; position: relative; }
.brand i::after { content: ""; position: absolute; inset: 7px; border: 2px solid var(--on-accent); border-radius: 50%; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs a { padding: 7px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; }
nav.tabs a.on { background: var(--accent-soft); color: var(--accent); }
main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 16px; margin: 0 0 12px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.stack { display: grid; gap: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line2); background: var(--panel); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--soft); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13.5px; }
.btn.ghost { border-color: transparent; background: transparent; }
.x { border: 0; background: transparent; cursor: pointer; color: var(--faint); font-size: 16px; padding: 4px 8px; border-radius: 6px; }
.x:hover { background: var(--soft); color: var(--bad); }

label.f { display: block; font-weight: 500; font-size: 14px; margin-bottom: 5px; }
.field { margin-bottom: 14px; }
.help { color: var(--faint); font-size: 12.5px; margin-top: 4px; }
input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], input[type=email], select, textarea {
  width: 100%; border: 1px solid var(--line2); background: var(--panel); border-radius: 8px; padding: 8px 10px; outline: none; min-width: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 70px; }
textarea.code { font-family: var(--mono); font-size: 13px; direction: ltr; text-align: left; }
.w-auto { width: auto !important; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line2); background: var(--panel); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 500; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 9px; padding: 3px; background: var(--soft); }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.days { display: flex; gap: 5px; flex-wrap: wrap; }
.days button { width: 38px; height: 34px; border: 1px solid var(--line2); background: var(--panel); border-radius: 8px; cursor: pointer; font-weight: 600; }
.days button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { display: none; }
.switch span { width: 40px; height: 22px; border-radius: 22px; background: var(--line2); position: relative; transition: .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .15s; }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { inset-inline-start: 21px; }
.check { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

.line { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.line > * { flex: 1 1 0; }
.line > .x, .line > .tag-he { flex: 0 0 auto; }
.tag-he { color: var(--muted); font-size: 13px; min-width: 120px; }
.tag-he.past { color: var(--bad); }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-ok { background: var(--ok-soft); color: var(--ok); } .b-bad { background: var(--bad-soft); color: var(--bad); }
.b-gray { background: var(--gray-soft); color: var(--muted); } .b-run { background: var(--accent-soft); color: var(--accent); }

.task { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; }
.task + .task { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.task .name { font-weight: 600; font-size: 16px; }
.task .meta { color: var(--muted); font-size: 13.5px; display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 3px; }
.empty { text-align: center; color: var(--faint); padding: 40px 10px; }

.editor { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.side { position: sticky; top: 76px; display: grid; gap: 16px; }
.next li { list-style: none; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.next li:last-child { border: 0; }
.next { margin: 0; padding: 0; }
.errors { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; }
.errors ul { margin: 6px 0 0; padding-inline-start: 18px; }
.rule { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--soft); margin-bottom: 12px; }
.rule-ok { border-inline-start: 4px solid var(--ok); }
.rule-bad { border-inline-start: 4px solid var(--bad); }
.step { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 13px; margin-inline-end: 8px; }
.var-chips { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.vchip { border: 1px dashed var(--line2); background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; color: var(--accent); }
.vchip:hover { border-style: solid; border-color: var(--accent); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.ex { text-align: start; border: 1px solid var(--line2); background: var(--panel); border-radius: 10px; padding: 14px; cursor: pointer; display: grid; gap: 4px; }
.ex:hover { border-color: var(--accent); background: var(--accent-soft); }
.ex span { color: var(--muted); font-size: 13px; }
.md { line-height: 1.7; }
.md .md-h { margin: 22px 0 10px; } .md h2.md-h { font-size: 21px; margin-top: 0; } .md h3.md-h { font-size: 18px; border-bottom: 1px solid var(--line); padding-bottom: 6px; } .md h4.md-h { font-size: 15.5px; }
.md p { margin: 8px 0; } .md pre.box { margin: 10px 0; max-height: none; } .md table { margin: 10px 0; } .md hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
.md code { background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.rule-num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.cond { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.cond > select, .cond > input { flex: 1 1 120px; width: auto; }
.sub { font-weight: 600; font-size: 13.5px; margin: 12px 0 6px; }
.vars { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 14px; font-size: 13px; margin-top: 8px; }
.vars code { color: var(--accent); }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: start; padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
th { color: var(--muted); font-size: 12.5px; font-weight: 600; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--soft); }
.tbl { overflow-x: auto; }
pre.box { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px; white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 var(--mono); max-height: 320px; overflow: auto; direction: ltr; text-align: left; margin: 0; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; word-break: break-word; }

.overlay { position: fixed; inset: 0; background: rgba(10,14,22,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border-radius: 12px; width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.modal-h h2 { margin: 0; }
.modal-b { padding: 18px; }
iframe.mail { width: 100%; height: 240px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.toasts { position: fixed; bottom: 18px; inset-inline-start: 18px; display: grid; gap: 8px; z-index: 60; }
.toast { background: var(--text); color: var(--panel); padding: 10px 16px; border-radius: 9px; max-width: 420px; }
.toast.ok { background: var(--ok); color: #fff; } .toast.bad { background: var(--bad); color: #fff; }
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login .card { width: min(360px, 100%); }

@media (max-width: 900px) { .editor { grid-template-columns: 1fr; } .side { position: static; } }
@media (max-width: 640px) {
  .top-in { gap: 10px; padding: 0 12px; } .brand span { display: none; }
  main { padding: 16px 14px 60px; } .grid2 { grid-template-columns: 1fr; }
  .task { grid-template-columns: 1fr; } .line { flex-wrap: wrap; } .tag-he { min-width: 0; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script>
'use strict';
const BASE = '__BASE_PATH__';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const TZ = 'Asia/Jerusalem';
const fmtFull = new Intl.DateTimeFormat('he-IL', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const fmt = (ms) => (ms ? fmtFull.format(ms) : '—');
const rtf = new Intl.RelativeTimeFormat('he', { numeric: 'auto' });
function rel(ms) {
  const s = (ms - Date.now()) / 1000, a = Math.abs(s);
  if (a < 50) return s > 0 ? 'בעוד רגע' : 'הרגע';
  if (a < 3600) return rtf.format(Math.round(s / 60), 'minute');
  if (a < 86400) return rtf.format(Math.round(s / 3600), 'hour');
  return rtf.format(Math.round(s / 86400), 'day');
}
const DAYS = ["א'", "ב'", "ג'", "ד'", "ה'", "ו'", "ש'"];
const GREG_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
const HEB_DAYS = ['', 'א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ז׳', 'ח׳', 'ט׳', 'י׳', 'י״א', 'י״ב', 'י״ג', 'י״ד', 'ט״ו', 'ט״ז', 'י״ז', 'י״ח', 'י״ט', 'כ׳', 'כ״א', 'כ״ב', 'כ״ג', 'כ״ד', 'כ״ה', 'כ״ו', 'כ״ז', 'כ״ח', 'כ״ט', 'ל׳'];
// "2027-01-23 09:00" → "23.01.2027 09:00"
const nice = (local) => `${local.slice(8, 10)}.${local.slice(5, 7)}.${local.slice(0, 4)} ${local.slice(11, 16)}`;
const badge = (t, c) => `<span class="badge ${c}">${esc(t)}</span>`;
const resultBadge = (s) => (s === 'success' ? badge('הצליח', 'b-ok') : s === 'failure' ? badge('נכשל', 'b-bad') : s === 'running' ? badge('רץ', 'b-run') : badge('טרם רץ', 'b-gray'));

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), kind === 'bad' ? 6000 : 3000);
}
async function api(method, path, data) {
  const opts = { method, headers: { 'X-Requested-With': 'scheduler' } };
  if (data !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(data); }
  const res = await fetch(`${BASE}/api${path}`, opts);
  const out = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/login') { showLogin(); throw new Error('נדרשת התחברות'); }
  if (!res.ok) { const e = new Error(out.error || `שגיאה ${res.status}`); e.data = out; throw e; }
  return out;
}
function modal(title, html) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><div class="modal-h"><h2>${title}</h2><button class="x" data-close>✕</button></div><div class="modal-b">${html}</div></div>`;
  ov.onclick = (e) => { if (e.target === ov || e.target.closest('[data-close]')) closeModal(); };
  document.body.append(ov);
  return ov;
}
const closeModal = () => $$('.overlay').forEach((o) => o.remove());
document.addEventListener('keydown', (e) => e.key === 'Escape' && closeModal());
const confirmDo = (text) => window.confirm(text);

// ---------- כניסה ומסגרת ----------
function showLogin() {
  $('#app').innerHTML = `<div class="login"><form class="card" id="lf"><h2>מתזמן משימות</h2>
    <div class="field"><label class="f" for="pw">סיסמה</label><input type="password" id="pw" autofocus></div>
    <div class="small" style="color:var(--bad)" id="le"></div>
    <button class="btn primary" style="width:100%;margin-top:8px">כניסה</button></form></div>`;
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    try { await api('POST', '/login', { password: $('#pw').value }); shell(); route(); }
    catch (err) { $('#le').textContent = err.message; }
  };
}
function shell() {
  $('#app').innerHTML = `<header class="top"><div class="top-in">
      <div class="brand"><i></i><span>מתזמן משימות</span></div>
      <nav class="tabs"><a href="#/" data-nav="tasks">משימות</a><a href="#/runs" data-nav="runs">יומן ריצות</a><a href="#/settings" data-nav="settings">הגדרות מייל</a><a href="#/docs" data-nav="docs">תיעוד</a></nav>
      <span class="spacer"></span><button class="btn ghost sm" id="logout">יציאה</button></div></header><main id="view"></main>`;
  $('#logout').onclick = async () => { await api('POST', '/logout').catch(() => {}); showLogin(); };
}
let META = null;
let timer = null;
async function route() {
  if (!$('#view')) return;
  clearInterval(timer);
  closeModal();
  const h = location.hash.replace(/^#\/?/, '');
  const [path, q = ''] = h.split('?');
  const parts = path.split('/');
  $$('nav.tabs a').forEach((a) => a.classList.toggle('on', a.dataset.nav === (parts[0] === 'task' || !parts[0] ? 'tasks' : parts[0])));
  if (!META) META = await api('GET', '/meta');
  try {
    if (parts[0] === 'task') await editor(parts[1] === 'new' ? null : Number(parts[1]), new URLSearchParams(q));
    else if (parts[0] === 'runs') await runsPage(new URLSearchParams(q));
    else if (parts[0] === 'settings') await settingsPage();
    else if (parts[0] === 'docs') await docsPage();
    else await tasksPage();
  } catch (e) {
    if (e.message !== 'נדרשת התחברות') $('#view').innerHTML = `<div class="errors">שגיאה: ${esc(e.message)}</div>`;
  }
}
window.addEventListener('hashchange', route);

// ---------- רשימת משימות ----------
async function tasksPage() {
  const load = async () => {
    const { tasks } = await api('GET', '/tasks');
    $('#list').innerHTML = tasks.length ? tasks.map((t) => `
      <div class="task" data-id="${t.id}">
        <div>
          <div class="row"><a class="name" href="#/task/${t.id}">${esc(t.name)}</a>${t.enabled ? '' : badge('מושבתת', 'b-gray')}${t.running ? badge('רצה עכשיו', 'b-run') : ''}</div>
          <div class="meta"><span>${esc(t.description)}</span><span class="ltr mono">${esc(t.url)}</span>${t.rules ? `<span>${t.rules === 1 ? 'כלל אחד' : `${t.rules} כללים`}</span>` : ''}</div>
          <div class="meta">
            <span>הבאה: ${t.next ? `<b>${esc(t.next.day)} ${esc(nice(t.next.local))}</b> · ${esc(t.next.hebrew)} · ${rel(t.next.at)}` : '—'}</span>
            <span>אחרונה: ${t.last_run_at ? `${resultBadge(t.last_status)} ${fmt(t.last_run_at)}${t.last_error ? ` · <span style="color:var(--bad)">${esc(t.last_error)}</span>` : ''}` : resultBadge(null)}</span>
          </div>
        </div>
        <div class="row">
          <button class="btn sm" data-a="run">הרץ עכשיו</button>
          <a class="btn sm" href="#/task/${t.id}">עריכה</a>
          <button class="btn sm" data-a="${t.enabled ? 'disable' : 'enable'}">${t.enabled ? 'השבתה' : 'הפעלה'}</button>
          <a class="btn sm ghost" href="#/runs?task=${t.id}">יומן</a>
          <button class="x" data-a="delete" title="מחיקה">✕</button>
        </div>
      </div>`).join('') : `<div class="empty">אין עדיין משימות.<br><br><a class="btn primary" href="#/task/new">יצירת משימה ראשונה</a></div>`;
  };
  $('#view').innerHTML = `<div class="head"><h1>משימות</h1><div class="row">
      <a class="btn" href="#/task/new?json=1">הדבקת JSON</a><a class="btn primary" href="#/task/new">משימה חדשה</a></div></div>
    <div class="card" id="list"></div>`;
  $('#list').onclick = async (e) => {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    const id = b.closest('[data-id]').dataset.id;
    const a = b.dataset.a;
    try {
      if (a === 'run') await runNow(id, b);
      else if (a === 'delete') { if (!confirmDo('למחוק את המשימה ואת יומן הריצות שלה?')) return; await api('DELETE', `/tasks/${id}`); toast('נמחקה', 'ok'); }
      else { await api('POST', `/tasks/${id}/${a}`); toast(a === 'enable' ? 'הופעלה' : 'הושבתה', 'ok'); }
      await load();
    } catch (err) { toast(err.message, 'bad'); }
  };
  await load();
  timer = setInterval(() => !document.hidden && !$('.overlay') && load().catch(() => {}), 20000);
}

async function runNow(id, btn) {
  const t = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = 'רצה...'; }
  try {
    const { run } = await api('POST', `/tasks/${id}/run`);
    toast(run.status === 'success' ? `הצליח (${run.status_code})` : `נכשל: ${run.error}`, run.status === 'success' ? 'ok' : 'bad');
    showRun(run.id);
  } finally { if (btn) { btn.disabled = false; btn.textContent = t; } }
}

  }
  function renderHeaders() {
    $('#hdrs').innerHTML = headerRows.map((r, i) => `<div class="line"><input type="text" class="ltr mono" data-hr="${i}" data-k="k" value="${esc(r.k)}" placeholder="Authorization">
      <input type="text" class="ltr mono" data-hr="${i}" data-k="v" value="${esc(r.v)}" placeholder="Bearer ..." style="flex:2"><button class="x" data-cmd="del-header" data-i="${i}">✕</button></div>`).join('');
  }
  const FIELD_TYPES = [['status', 'קוד התגובה'], ['body', 'גוף התגובה'], ['json', 'שדה JSON'], ['header', 'כותרת']];
  function condRow(c, path) {
    const kind = c.field.startsWith('json:') ? 'json' : c.field.startsWith('header:') ? 'header' : c.field;
    const sub = kind === 'json' || kind === 'header' ? c.field.slice(kind.length + 1) : '';
    return `<div class="cond"><select data-fieldkind="${path}">${opt(FIELD_TYPES, kind)}</select>
      ${kind === 'json' || kind === 'header' ? `<input type="text" class="ltr mono" data-fieldsub="${path}" data-kind="${kind}" value="${esc(sub)}" placeholder="${kind === 'json' ? 'data.status' : 'content-type'}">` : ''}
      <select data-b="${path}.op" data-rerender>${opt(Object.entries(META.ops), c.op)}</select>
      ${c.op === 'exists' || c.op === 'not_exists' ? '' : `<input type="text" data-b="${path}.value" value="${esc(c.value ?? '')}" placeholder="ערך">`}
      <button class="x" data-cmd="del" data-path="${path}">✕</button></div>`;
  }
  const toList = (v) => (Array.isArray(v) ? v.join(', ') : v || '');
  const varChips = () => `<div class="var-chips"><span class="small faint">הוספה לטקסט:</span>${META.variables.filter(([v]) => !v.startsWith('{{secret') && v !== '{{timestamp}}').map(([v, d]) => `<button class="vchip" data-insert="${esc(v)}" title="${esc(d)}">${esc(d.split(' (')[0])}</button>`).join('')}</div>`;
  function emailFields(p, rule) {
    return `<div class="grid2"><div class="field"><label class="f">אל</label><input type="text" class="ltr" data-b="${p}.email.to" data-t="list" value="${esc(toList(rule.email.to))}" placeholder="a@x.com, b@x.com"></div>
        <div class="field"><label class="f">עותק (רשות)</label><input type="text" class="ltr" data-b="${p}.email.cc" data-t="list" value="${esc(toList(rule.email.cc))}"></div></div>
      <div class="field"><label class="f">נושא</label><input type="text" data-b="${p}.email.subject" value="${esc(rule.email.subject)}"></div>
      <div class="field"><label class="f">תוכן</label><textarea rows="5" data-b="${p}.email.body">${esc(rule.email.body)}</textarea>${varChips()}</div>`;
  }
  function renderRules() {
    cfg.rules.forEach((r) => { r.if ||= []; r.email ||= { to: [], cc: [], subject: '', body: '' }; });
    const sIdx = simpleIndex('success'), fIdx = simpleIndex('failure');
    $('#simple-mail').innerHTML = [['success', sIdx, 'לשלוח מייל כשהמשימה הצליחה'], ['failure', fIdx, 'לשלוח מייל כשהמשימה נכשלה']].map(([kind, idx, label]) => `
      <div class="rule ${kind === 'failure' ? 'rule-bad' : 'rule-ok'}">
        <label class="switch"><input type="checkbox" data-simple="${kind}" ${idx >= 0 ? 'checked' : ''}><span></span><b>${label}</b></label>
        ${idx >= 0 ? `<div style="margin-top:12px">${emailFields(`rules.${idx}`, cfg.rules[idx])}</div>` : ''}
      </div>`).join('');
    const adv = cfg.rules.map((rule, i) => [rule, i]).filter(([, i]) => i !== sIdx && i !== fIdx);
    $('#rules').innerHTML = adv.map(([rule, i], n) => {
      const p = `rules.${i}`;
      return `<div class="rule">
        <div class="row" style="flex-wrap:nowrap;margin-bottom:10px"><span class="rule-num">${n + 1}</span>
          <input type="text" data-b="${p}.name" value="${esc(rule.name || '')}" placeholder="שם הכלל (רשות)">
          <button class="x" data-cmd="del" data-path="${p}">✕</button></div>
        <div class="row"><b class="small">מתי:</b><select class="w-auto" data-b="${p}.when">${opt(Object.entries(META.when), rule.when || 'always')}</select>
          ${rule.if.length > 1 ? `<select class="w-auto" data-b="${p}.match">${opt([['all', 'וגם כל התנאים:'], ['any', 'וגם לפחות תנאי אחד:']], rule.match)}</select>` : rule.if.length ? '<span class="small">וגם:</span>' : ''}</div>
        <div style="margin-top:8px">${rule.if.map((c, j) => condRow(c, `${p}.if.${j}`)).join('')}</div>
        <button class="btn sm" data-cmd="add-cond" data-i="${i}">+ תנאי על התשובה</button>
        <div class="sub">המייל</div>
        ${emailFields(p, rule)}
        <label class="check small"><input type="checkbox" data-b="${p}.stop" data-t="bool" ${rule.stop ? 'checked' : ''}>אם הכלל הזה התקיים, לא לשלוח את המיילים שאחריו</label>
      </div>`;
    }).join('');
  }

  function simpleIndex(kind) { return cfg.rules.findIndex((r) => r.when === kind && isSimple(r)); }

  // ----- עריכת ערכים -----
  const parts = (path) => path.split('.').map((x) => (/^\d+$/.test(x) ? Number(x) : x));
  function setPath(path, value) {
    const ps = parts(path);
    let o = cfg;
    for (const k of ps.slice(0, -1)) o = o[k] ??= {};
    o[ps[ps.length - 1]] = value;
  }
  function getPath(path) { return parts(path).reduce((o, k) => o?.[k], cfg); }
  function valueOf(el) {
    const t = el.dataset.t;
    if (t === 'bool') return el.checked;
    if (t === 'num') return Number(el.value);
    if (t === 'lines') return el.value.split('\n').map((x) => x.trim()).filter(Boolean);
    if (t === 'list') return el.value.split(/[,;]/).map((x) => x.trim()).filter(Boolean);
    return el.value;
  }
  $('#main').addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.b && el.type !== 'checkbox' && el.tagName !== 'SELECT') setPath(el.dataset.b, valueOf(el));
    if (el.dataset.dr) dateRows[el.dataset.dr][el.dataset.k] = el.value;
    if (el.dataset.hr) headerRows[el.dataset.hr][el.dataset.k] = el.value;
    if (el.dataset.fieldsub) setPath(`${el.dataset.fieldsub}.field`, `${el.dataset.kind}:${el.value}`);
    if (el.dataset.dr) { const r = dateRows[el.dataset.dr]; el.parentElement.querySelector('[data-he]').dataset.he = r.d && r.t ? `${r.d} ${r.t}` : ''; }
    changed();
  });
  $('#main').addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.b && (el.type === 'checkbox' || el.tagName === 'SELECT')) {
      setPath(el.dataset.b, valueOf(el));
      if (el.dataset.b === 'request.method' || el.hasAttribute('data-rerender')) renderForm();
    }
    if (el.dataset.simple) {
      const idx = simpleIndex(el.dataset.simple);
      if (el.checked && idx < 0) cfg.rules.push(SIMPLE_MAIL[el.dataset.simple]());
      if (!el.checked && idx >= 0) cfg.rules.splice(idx, 1);
      renderRules();
    }
    if (el.dataset.fieldkind) {
      const k = el.value;
      setPath(`${el.dataset.fieldkind}.field`, k === 'json' ? 'json:' : k === 'header' ? 'header:' : k);
      renderRules();
    }
    changed();
  });
  let lastField = null;
  $('#main').addEventListener('focusin', (e) => { if (e.target.matches('input[type=text], textarea')) lastField = e.target; });
  $('#main').addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b || !$('#main').contains(b)) return;
    if (b.dataset.insert) {
      // מוסיף את המשתנה לשדה האחרון שנבחר בתוך אותו מייל (ברירת מחדל: התוכן)
      const box = b.closest('.rule');
      const target = lastField && box?.contains(lastField) ? lastField : box?.querySelector('textarea');
      if (!target) return;
      const pos = target.selectionStart ?? target.value.length;
      target.value = target.value.slice(0, pos) + b.dataset.insert + target.value.slice(target.selectionEnd ?? pos);
      target.focus();
      target.setSelectionRange(pos + b.dataset.insert.length, pos + b.dataset.insert.length);
      target.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }
    const s = cfg.schedule;
    if (b.dataset.stype) {
      if (b.dataset.stype !== s.type) cfg.schedule = SCHEDULE_DEFAULTS[b.dataset.stype](s.times);
      renderForm();
    } else if (b.dataset.day) {
      const d = Number(b.dataset.day);
      s.days = s.days.includes(d) ? s.days.filter((x) => x !== d) : [...s.days, d].sort();
      renderSchedule();
    } else if (b.dataset.cal) {
      s.calendar = b.dataset.cal;
      if (s.type === 'yearly') s.month = s.calendar === 'hebrew' ? 'tishrei' : 1;
      if (s.calendar === 'hebrew' && s.day > 30) s.day = 30;
      renderSchedule();
    } else if (b.dataset.cmd) {
      const c = b.dataset.cmd, i = Number(b.dataset.i);
      if (c === 'add-date') {
        const last = dateRows[dateRows.length - 1];
        let d = '';
        if (last?.d) { const x = new Date(`${last.d}T12:00:00Z`); x.setUTCDate(x.getUTCDate() + 1); d = x.toISOString().slice(0, 10); }
        dateRows.push({ d, t: last?.t || '09:00' });
        renderSchedule();
      } else if (c === 'del-date') { dateRows.splice(i, 1); renderSchedule(); }
      else if (c === 'heb-open') $('#heb').classList.toggle('hidden');
      else if (c === 'heb-add') {
        try {
          const { date } = await api('GET', `/hebrew-to-gregorian?year=${$('#h-year').value}&month=${$('#h-month').value}&day=${$('#h-day').value}`);
          dateRows = dateRows.filter((r) => r.d);
          dateRows.push({ d: date, t: $('#h-time').value || '09:00' });
          renderSchedule();
          toast(`נוסף: ${date.split('-').reverse().join('.')}`, 'ok');
        } catch (err) { toast(err.message, 'bad'); return; }
      } else if (c === 'add-time') { s.times.push('12:00'); renderSchedule(); }
      else if (c === 'add-header') { headerRows.push({ k: '', v: '' }); renderHeaders(); }
      else if (c === 'del-header') { headerRows.splice(i, 1); renderHeaders(); }
      else if (c === 'fmt-body') { try { cfg.request.body = JSON.stringify(JSON.parse(cfg.request.body), null, 2); renderForm(); } catch { toast('הגוף אינו JSON תקין', 'bad'); } }
      else if (c === 'add-rule') { cfg.rules.push({ ...NEW_RULE(), if: [{ field: 'json:', op: 'equals', value: '' }], stop: true }); renderRules(); $$('#rules .rule').pop()?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      else if (c === 'add-cond') { cfg.rules[i].if.push({ field: 'json:', op: 'equals', value: '' }); renderRules(); }
      else if (c === 'move') { const j = i + Number(b.dataset.d); [cfg.rules[i], cfg.rules[j]] = [cfg.rules[j], cfg.rules[i]]; renderRules(); }
      else if (c === 'del') {
        const ps = parts(b.dataset.path);
        getPath(ps.slice(0, -1).join('.')).splice(ps[ps.length - 1], 1);
        if (b.dataset.path.startsWith('schedule')) renderSchedule(); else renderRules();
      }
    } else return;
    changed();
  });

  function renderGallery() {
    $('#main').innerHTML = `<div class="card"><h2>במה להתחיל?</h2><div class="help" style="margin:-6px 0 14px">בחר דוגמה - היא תמלא את הטופס, ואז רק משנים את הפרטים שלך.</div>
      <div class="gallery">${EXAMPLES.map((x, i) => `<button class="ex" data-ex="${i}"><b>${esc(x.title)}</b><span>${esc(x.desc)}</span></button>`).join('')}</div></div>`;
    $$('[data-ex]').forEach((b) => (b.onclick = () => {
      cfg = EXAMPLES[b.dataset.ex].config ? JSON.parse(JSON.stringify(EXAMPLES[b.dataset.ex].config)) : NEW_TASK();
      dateRows = (cfg.schedule.dates || []).map((d) => ({ d: d.slice(0, 10), t: d.slice(11, 16) }));
      headerRows = Object.entries(cfg.request.headers || {}).map(([k, v]) => ({ k, v }));
      started = true;
      setTab('form');
    }));
  }
  let started = Boolean(id);

  function setTab(t) {
    if (tab === 'json' && t === 'form' && !applyJson()) return;
    tab = t;
    $$('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    if (tab === 'form' && !started) { renderGallery(); return; }
    started = true;
    tab === 'json' ? renderJson() : renderForm();
    validateNow();
  }
  $$('[data-tab]').forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));

  const current = () => { if (tab === 'json') { try { cfg = JSON.parse($('#j').value); } catch (e) { throw new Error(`JSON לא תקין: ${e.message}`); } } else syncRows(); return cfg; };
  $('#save').onclick = async () => {
    try {
      const r = await api(id ? 'PUT' : 'POST', id ? `/tasks/${id}` : '/tasks', { config: current() });
      toast('נשמר', 'ok');
      if (!id) location.hash = `#/task/${r.task.id}`; else { cfg = r.config; validateNow(); }
    } catch (err) {
      if (err.data?.errors) { info.errors = err.data.errors; $('#errs').classList.remove('hidden'); $('#errs').innerHTML = `<b>צריך לתקן:</b><ul>${err.data.errors.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`; $('#errs').scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      toast(err.message, 'bad');
    }
  };
  $('#test').onclick = async (e) => {
    const b = e.currentTarget;
    b.disabled = true;
    try {
      const r = await api('POST', '/test', { config: current() });
      const ov = modal('תוצאת הבדיקה', `
        <dl class="kv"><dt>תוצאה</dt><dd>${resultBadge(r.outcome)} ${r.error ? esc(r.error) : ''}</dd><dt>קוד תגובה</dt><dd>${r.status_code ?? '—'}</dd><dt>משך</dt><dd>${r.duration_ms} מ"ש</dd></dl>
        <h2 style="margin-top:16px">מיילים שהיו נשלחים (${r.emails.length})</h2>
        ${r.emails.map((m, i) => `<div class="card" style="margin-bottom:10px;background:var(--soft)"><dl class="kv"><dt>כלל</dt><dd>${esc(m.rule)}</dd><dt>אל</dt><dd class="ltr" style="text-align:right">${esc(m.to.join(', '))}</dd>${m.cc.length ? `<dt>עותק</dt><dd class="ltr" style="text-align:right">${esc(m.cc.join(', '))}</dd>` : ''}<dt>נושא</dt><dd>${esc(m.subject)}</dd></dl><iframe class="mail" sandbox data-m="${i}" style="margin-top:8px"></iframe></div>`).join('') || '<div class="faint">אף כלל לא התקיים</div>'}
        <h2 style="margin-top:16px">התגובה</h2><pre class="box">${esc(r.response || '(ריק)')}</pre>`);
      $$('iframe[data-m]', ov).forEach((f) => (f.srcdoc = r.emails[f.dataset.m].html));
    } catch (err) {
      if (err.data?.errors) toast(err.data.errors[0], 'bad'); else toast(err.message, 'bad');
    } finally { b.disabled = false; }
  };
  if (id) {
    $('#run').onclick = (e) => runNow(id, e.currentTarget).catch((err) => toast(err.message, 'bad'));
    $('#del').onclick = async () => { if (confirmDo('למחוק את המשימה?')) { await api('DELETE', `/tasks/${id}`); location.hash = '#/'; } };
  }
  setTab(tab);
}

// ---------- יומן ריצות ----------
async function runsPage(params) {
  const { tasks } = await api('GET', '/tasks');
  let taskId = params.get('task') || '';
  let lastId = null;
  $('#view').innerHTML = `<div class="head"><h1>יומן ריצות</h1>
      <select class="w-auto" id="f-task"><option value="">כל המשימות</option>${tasks.map((t) => `<option value="${t.id}" ${String(t.id) === taskId ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></div>
    <div class="card tbl"><table><thead><tr><th>זמן</th><th>משימה</th><th>תוצאה</th><th>קוד</th><th>משך</th><th>מיילים</th><th>הערה</th></tr></thead><tbody id="rb"></tbody></table>
    <div class="empty hidden" id="re">אין ריצות</div></div>
    <div style="text-align:center;margin-top:12px"><button class="btn hidden" id="more">עוד</button></div>
    <div class="help" style="margin-top:10px">ריצות נשמרות 30 יום.</div>`;
  async function load(append) {
    const q = new URLSearchParams();
    if (taskId) q.set('task_id', taskId);
    if (append && lastId) q.set('before_id', lastId);
    const d = await api('GET', `/runs?${q}`);
    const html = d.runs.map((r) => `<tr class="click" data-run="${r.id}"><td>${fmt(r.started_at)}</td><td>${esc(r.task_name)}${r.trigger === 'manual' ? ' <span class="faint small">(ידני)</span>' : ''}</td>
      <td>${resultBadge(r.status)}</td><td class="mono">${r.status_code ?? '—'}</td><td>${r.duration_ms != null ? `${(r.duration_ms / 1000).toFixed(1)} ש'` : '—'}</td><td>${r.emails || '—'}</td><td class="small muted">${esc(r.error || '')}</td></tr>`).join('');
    $('#rb').innerHTML = append ? $('#rb').innerHTML + html : html;
    if (d.runs.length) lastId = d.runs[d.runs.length - 1].id;
    $('#re').classList.toggle('hidden', !!$('#rb').children.length);
    $('#more').classList.toggle('hidden', !d.has_more);
  }
  $('#f-task').onchange = (e) => { taskId = e.target.value; lastId = null; load(); };
  $('#more').onclick = () => load(true);
  $('#rb').onclick = (e) => { const tr = e.target.closest('[data-run]'); if (tr) showRun(tr.dataset.run); };
  await load();
}
async function showRun(id) {
  const { run } = await api('GET', `/runs/${id}`);
  modal(`ריצה · ${esc(run.task_name)}`, `
    <dl class="kv"><dt>תוצאה</dt><dd>${resultBadge(run.status)} ${esc(run.error || '')}</dd><dt>זמן</dt><dd>${fmt(run.started_at)} ${run.trigger === 'manual' ? '(הרצה ידנית)' : ''}</dd>
      <dt>בקשה</dt><dd class="ltr mono" style="text-align:right">${esc(run.request_summary || '')}</dd><dt>קוד תגובה</dt><dd>${run.status_code ?? '—'}</dd>
      <dt>ניסיונות</dt><dd>${run.attempts}</dd><dt>משך</dt><dd>${run.duration_ms ?? '—'} מ"ש</dd></dl>
    <h2 style="margin-top:16px">מיילים</h2>
    ${run.emails.length ? `<table><tr><th>כלל</th><th>אל</th><th>נושא</th><th></th></tr>${run.emails.map((m) => `<tr><td>${esc(m.rule)}</td><td class="ltr">${esc(m.to.join(', '))}</td><td>${esc(m.subject)}</td><td>${m.ok ? badge('נשלח', 'b-ok') : `${badge('לא נשלח', 'b-bad')} <span class="small">${esc(m.error)}</span>`}</td></tr>`).join('')}</table>` : '<div class="faint">לא נשלחו מיילים</div>'}
    <h2 style="margin-top:16px">התגובה</h2><pre class="box">${esc(run.response_snippet || '(ריק)')}</pre>`);
}

// ---------- תיעוד ----------
// מציג Markdown פשוט: כותרות, טבלאות, רשימות, בלוקי קוד, קו מפריד, **מודגש** ו-`קוד`
function mdToHtml(md) {
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code class="ltr">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const out = [];
  const lines = md.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith('```')) {
      const code = [];
      while (++i < lines.length && !lines[i].startsWith('```')) code.push(lines[i]);
      out.push(`<pre class="box">${esc(code.join('\n'))}</pre>`);
    } else if (/^#{1,4} /.test(l)) {
      const n = l.match(/^#+/)[0].length;
      out.push(`<h${n + 1} class="md-h">${inline(l.slice(n + 1))}</h${n + 1}>`);
    } else if (l.startsWith('|')) {
      const rows = [];
      for (; i < lines.length && lines[i].startsWith('|'); i++) rows.push(lines[i]);
      i--;
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      out.push(`<div class="tbl"><table><tr>${cells(rows[0]).map((c) => `<th>${inline(c)}</th>`).join('')}</tr>${rows.slice(2).map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table></div>`);
    } else if (/^(\d+\.|-) /.test(l)) {
      const tag = l.startsWith('-') ? 'ul' : 'ol';
      const items = [];
      for (; i < lines.length && /^(\d+\.|-) /.test(lines[i]); i++) items.push(lines[i].replace(/^(\d+\.|-) /, ''));
      i--;
      out.push(`<${tag}>${items.map((x) => `<li>${inline(x)}</li>`).join('')}</${tag}>`);
    } else if (l.trim() === '---') out.push('<hr>');
    else if (l.trim()) out.push(`<p>${inline(l)}</p>`);
  }
  return out.join('\n');
}
