<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>מתזמן משימות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f9fafb; --border: #e3e6eb; --border-strong: #cfd4dc;
  --text: #1a1f2b; --muted: #5d6676; --faint: #8b93a1;
  --accent: #2456d3; --accent-soft: #e8eefc; --accent-text: #ffffff;
  --ok: #0f7b4b; --ok-soft: #e3f5ec; --bad: #b42318; --bad-soft: #fdebea; --warn: #9a5b00; --warn-soft: #fff4dc;
  --info: #175cd3; --info-soft: #e7effd; --gray-soft: #eef0f3;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1218; --panel: #171b23; --panel-2: #1c212b; --border: #2a303c; --border-strong: #3a4250;
    --text: #e7eaf0; --muted: #a2aab8; --faint: #7a8392;
    --accent: #5b8cff; --accent-soft: #1d2b4d; --accent-text: #0b1020;
    --ok: #4cc38a; --ok-soft: #12301f; --bad: #ff7b72; --bad-soft: #3a1513; --warn: #f0b44c; --warn-soft: #3a2a0c;
    --info: #79a6ff; --info-soft: #172544; --gray-soft: #232935;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 Heebo, "Segoe UI", Arial, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 13px; }
td code { white-space: nowrap; }
.ltr { direction: ltr; text-align: left; unicode-bidi: plaintext; }
.hidden { display: none !important; }

/* layout */
.app { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
.side { align-self: start; background: var(--panel); border-inline-start: 0; border-inline-end: 1px solid var(--border); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; padding: 4px 10px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.nav a:hover { background: var(--panel-2); color: var(--text); text-decoration: none; }
.nav a.active { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 6px; }
.main { min-width: 0; padding: 24px 28px 60px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; margin: 0; }
.page-head .sub { color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* cards */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 18px; }
.card h2 { font-size: 16px; margin: 0 0 12px; }
.card h3 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
.grid { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.stat { padding: 16px 18px; }
.stat .label { color: var(--muted); font-size: 13px; }
.stat .value { font-size: 28px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
.stat .hint { color: var(--faint); font-size: 12.5px; margin-top: 2px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--panel); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
.btn-danger:hover { background: var(--bad-soft); }
.btn-sm { padding: 4px 10px; font-size: 13.5px; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn svg { width: 16px; height: 16px; }
.icon-btn { padding: 5px 7px; }

/* forms */
label.f { display: block; font-weight: 500; font-size: 14px; margin-bottom: 5px; }
.field { margin-bottom: 14px; }
.help { color: var(--faint); font-size: 12.5px; margin-top: 4px; }
.err { color: var(--bad); font-size: 13px; margin-top: 4px; }
input[type=text], input[type=password], input[type=url], input[type=email], input[type=number], input[type=search], input[type=datetime-local], input[type=time], select, textarea {
  width: 100%; border: 1px solid var(--border-strong); background: var(--panel); border-radius: 8px; padding: 8px 11px; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 90px; resize: vertical; font-family: var(--mono); font-size: 13px; }
.invalid { border-color: var(--bad) !important; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 9px; padding: 3px; background: var(--panel-2); gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--border-strong); border-radius: 22px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; top: 3px; inset-inline-start: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { inset-inline-start: 21px; }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: start; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12.5px; color: var(--muted); font-weight: 600; background: var(--panel-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--panel-2); }
.cell-title { font-weight: 600; }
.cell-sub { color: var(--muted); font-size: 13px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-bad { background: var(--bad-soft); color: var(--bad); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-info { background: var(--info-soft); color: var(--info); }
.b-gray { background: var(--gray-soft); color: var(--muted); }
.tag { display: inline-block; background: var(--gray-soft); color: var(--muted); border-radius: 6px; padding: 0 7px; font-size: 12px; margin-inline-end: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--panel); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.type-pill { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }

/* alerts */
.alert { border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.alert-warn { background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.alert-info { background: var(--info-soft); color: var(--info); border: 1px solid color-mix(in srgb, var(--info) 25%, transparent); }
.alert-bad { background: var(--bad-soft); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 25%, transparent); }

/* chart */
.chart { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-top: 8px; }
.chart .col { flex: 1; display: flex; flex-direction: column-reverse; height: 100%; min-width: 4px; position: relative; }
.chart .col span { display: block; width: 100%; }
.chart .s { background: var(--ok); opacity: .85; border-radius: 2px 2px 0 0; }
.chart .f { background: var(--bad); border-radius: 2px 2px 0 0; }
.chart .col:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel); font-size: 12px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; z-index: 2; }
.chart-axis { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; margin-top: 6px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: middle; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); align-items: center; }
.list li:last-child { border-bottom: 0; }
.empty { text-align: center; color: var(--faint); padding: 32px 12px; }

/* editor */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.editor .stack { display: grid; gap: 16px; }
.sticky { position: sticky; top: 16px; }
.next-runs { list-style: none; margin: 8px 0 0; padding: 0; }
.next-runs li { padding: 6px 0; border-bottom: 1px dashed var(--border); display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.next-runs li:last-child { border-bottom: 0; }
.cron-desc { font-weight: 600; color: var(--accent); }
.cron-fields { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; font-size: 12px; color: var(--muted); direction: ltr; margin-top: 6px; }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.days label { border: 1px solid var(--border-strong); border-radius: 8px; padding: 4px 10px; cursor: pointer; user-select: none; }
.days input { display: none; }
.days label:has(input:checked) { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.kv { display: grid; grid-template-columns: 1fr 1.6fr auto; gap: 6px; margin-bottom: 6px; }
.var-list { display: flex; flex-direction: column; gap: 6px; }
.var-item { border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; cursor: pointer; background: var(--panel-2); }
.var-item:hover { border-color: var(--accent); }
.var-item code { color: var(--accent); font-weight: 600; }
.var-item div { font-size: 12px; color: var(--muted); }
pre.box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12.5px; max-height: 340px; overflow: auto; margin: 0; direction: ltr; text-align: left; }
iframe.mail-preview { width: 100%; height: 320px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
.kvlist { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 14px; }
.kvlist dt { color: var(--muted); }
.kvlist dd { margin: 0; min-width: 0; word-break: break-word; }

/* menu */
details.menu { position: relative; display: inline-block; }
details.menu summary { list-style: none; }
details.menu summary::-webkit-details-marker { display: none; }
details.menu .menu-items { position: absolute; inset-inline-end: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.14); z-index: 20; min-width: 170px; padding: 5px; }
details.menu .menu-items button { display: block; width: 100%; text-align: start; border: 0; background: transparent; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
details.menu .menu-items button:hover { background: var(--panel-2); }
details.menu .menu-items button.danger { color: var(--bad); }

/* modal & toast */
.overlay { position: fixed; inset: 0; background: rgba(10,14,22,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border-radius: 12px; width: min(760px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); }
.modal-head h2 { margin: 0; font-size: 17px; }
.modal-body { padding: 18px 20px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-start; }
.toasts { position: fixed; bottom: 18px; inset-inline-start: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--text); color: var(--panel); padding: 10px 16px; border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 420px; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }
.spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.timeline { list-style: none; margin: 0; padding: 0; border-inline-start: 2px solid var(--border); }
.timeline li { position: relative; padding: 4px 16px 12px; }
.timeline li::before { content: ""; position: absolute; inset-inline-start: -6px; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login .card { width: min(380px, 100%); padding: 28px; }
.login h1 { font-size: 20px; margin: 12px 0 18px; }

@media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .editor { grid-template-columns: 1fr; } .sticky { position: static; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 8px 10px; border-inline-end: 0; border-bottom: 1px solid var(--border); }
  .brand { padding: 0 6px; font-size: 15px; } .brand span.txt { display: none; }
  .nav { display: flex; gap: 2px; } .nav a { padding: 7px 10px; white-space: nowrap; } .nav a span { display: none; }
  .side-foot { margin: 0; margin-inline-start: auto; flex-direction: row; }
  .side-foot .muted { display: none; }
  .main { padding: 16px 16px 60px; }
  .grid-2, .grid-4 { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
  .kv { grid-template-columns: 1fr; }
  .table-wrap > table { min-width: 760px; }
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts"></div>
<script>
'use strict';
// ---------- כלים ----------
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const TZ = 'Asia/Jerusalem';
const dtf = new Intl.DateTimeFormat('he-IL', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
const dtfShort = new Intl.DateTimeFormat('he-IL', { timeZone: TZ, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const dayFmt = new Intl.DateTimeFormat('he-IL', { timeZone: TZ, weekday: 'long' });
const hourFmt = new Intl.DateTimeFormat('he-IL', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const rtf = new Intl.RelativeTimeFormat('he', { numeric: 'auto' });
const fmt = (ms) => (ms ? dtf.format(ms) : '—');
const fmtShort = (ms) => (ms ? dtfShort.format(ms) : '—');
function rel(ms) {
  if (!ms) return '';
  const diff = (ms - Date.now()) / 1000;
  const a = Math.abs(diff);
  if (a < 45) return diff > 0 ? 'בעוד רגע' : 'הרגע';
  if (a < 3600) return rtf.format(Math.round(diff / 60), 'minute');
  if (a < 86400) return rtf.format(Math.round(diff / 3600), 'hour');
  return rtf.format(Math.round(diff / 86400), 'day');
}
const dur = (ms) => (ms == null ? '—' : ms < 1000 ? `${ms} מ"ש` : `${(ms / 1000).toFixed(ms < 10000 ? 2 : 1)} ש'`);
const num = (n) => Number(n || 0).toLocaleString('he-IL');

const ICONS = {
  dash: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  tasks: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  runs: '<path d="M12 8v4l3 2M21 12a9 9 0 1 1-9-9 9 9 0 0 1 9 9z"/>',
  mail: '<path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/>',
  settings: '<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  audit: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  play: '<path d="M7 4v16l13-8z"/>',
  more: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
};
const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), kind === 'bad' ? 7000 : 3500);
}

class ApiError extends Error {
  constructor(msg, status, data) { super(msg); this.status = status; this.data = data; }
}
async function api(method, path, body) {
  const opts = { method, headers: { 'X-Requested-With': 'scheduler' }, credentials: 'same-origin' };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(`/api${path}`, opts);
  let data = null;
  try { data = await res.json(); } catch {}
  if (res.status === 401 && path !== '/login') { showLogin(); throw new ApiError('נדרשת התחברות', 401, data); }
  if (!res.ok) throw new ApiError(data?.error || `שגיאה ${res.status}`, res.status, data);
  return data;
}

// ---------- תוויות ----------
const RUN_STATUS = { success: ['הצליחה', 'b-ok'], failure: ['נכשלה', 'b-bad'], running: ['רצה', 'b-info'] };
const EMAIL_STATUS = {
  sent: ['נשלח', 'b-info'], delayed: ['מתעכב', 'b-warn'], delivered: ['נמסר', 'b-ok'], opened: ['נפתח', 'b-ok'],
  clicked: ['נלחץ קישור', 'b-ok'], bounced: ['חזר', 'b-bad'], complained: ['סומן כספאם', 'b-bad'], failed: ['נכשל', 'b-bad'],
};
const EVENT_LABEL = {
  'email.sent': 'נשלח לשרת', 'email.delivered': 'נמסר לתיבה', 'email.delivery_delayed': 'המסירה מתעכבת', 'email.opened': 'נפתח',
  'email.clicked': 'קישור נלחץ', 'email.bounced': 'חזר (Bounce)', 'email.complained': 'סומן כספאם', 'email.failed': 'נכשל',
};
const SOURCE_LABEL = { task: 'משימה', manual: 'ידני', notification: 'התראה' };
const TRIGGER_LABEL = { schedule: 'מתוזמן', manual: 'ידני' };
const badge = ([text, cls]) => `<span class="badge ${cls}">${esc(text)}</span>`;
const runBadge = (s) => badge(RUN_STATUS[s] || [s, 'b-gray']);
const emailBadge = (s) => badge(EMAIL_STATUS[s] || [s, 'b-gray']);
function taskBadge(t) {
  if (t.running_since) return badge(['רצה כעת', 'b-info']);
  if (!t.enabled) return badge(['מושבתת', 'b-gray']);
  if (t.last_status === 'failure') return badge(['נכשלה', 'b-bad']);
  return badge(['פעילה', 'b-ok']);
}
const typePill = (t) => `<span class="type-pill">${t === 'email' ? 'מייל' : 'HTTP'}</span>`;

// ---------- מצב ----------
const state = { refreshTimer: null, settings: null };

function showLogin() {
  clearInterval(state.refreshTimer);
  $('#root').innerHTML = `
    <div class="login"><form class="card" id="login-form">
      <div class="brand-mark">${icon('clock')}</div>
      <h1>מתזמן משימות - כניסה</h1>
      <div class="field"><label class="f" for="pw">סיסמה</label><input type="password" id="pw" autocomplete="current-password" required autofocus></div>
      <div class="err" id="login-err"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" type="submit">כניסה</button>
    </form></div>`;
  $('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('button', e.target);
    btn.disabled = true;
    try {
      await api('POST', '/login', { password: $('#pw').value });
      renderShell();
      route();
    } catch (err) {
      $('#login-err').textContent = err.message;
      btn.disabled = false;
    }
  });
}

function renderShell() {
  const links = [
    ['dashboard', 'dash', 'לוח בקרה'], ['tasks', 'tasks', 'משימות'], ['runs', 'runs', 'יומן ריצות'],
    ['emails', 'mail', 'מיילים'], ['settings', 'settings', 'הגדרות'], ['audit', 'audit', 'יומן פעולות'],
  ];
  $('#root').innerHTML = `
    <div class="app">
      <aside class="side">
        <div class="brand"><div class="brand-mark">${icon('clock')}</div><span class="txt">מתזמן משימות</span></div>
        <nav class="nav">${links.map(([r, i, t]) => `<a href="#/${r}" data-route="${r}">${icon(i)}<span>${t}</span></a>`).join('')}</nav>
        <div class="side-foot">
          <div class="muted small">שעון ישראל · <span id="clock"></span></div>
          <button class="btn btn-sm btn-ghost" id="logout">${icon('logout')}<span class="hide-sm">יציאה</span></button>
        </div>
      </aside>
      <main class="main" id="view"></main>
    </div>`;
  $('#logout').onclick = async () => { await api('POST', '/logout').catch(() => {}); showLogin(); };
  const tickClock = () => { const c = $('#clock'); if (c) c.textContent = hourFmt.format(Date.now()); };
  tickClock();
  setInterval(tickClock, 15000);
}

function setActive(name) {
  $$('.nav a').forEach((a) => a.classList.toggle('active', a.dataset.route === name));
}

function autoRefresh(fn, ms = 15000) {
  clearInterval(state.refreshTimer);
  state.refreshTimer = setInterval(() => {
    if (document.hidden || $('.overlay') || document.activeElement?.matches('input,textarea,select')) return;
    fn().catch(() => {});
  }, ms);
}

// ---------- ניתוב ----------
async function route() {
  if (!$('#view')) return;
  clearInterval(state.refreshTimer);
  const hash = location.hash.replace(/^#\/?/, '') || 'dashboard';
  closeModal();
  const [path, query = ''] = hash.split('?');
  const params = new URLSearchParams(query);
  const parts = path.split('/');
  const view = $('#view');
  view.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
  try {
    if (parts[0] === 'dashboard') { setActive('dashboard'); await viewDashboard(); }
    else if (parts[0] === 'tasks' && parts[1] === 'new') { setActive('tasks'); await viewEditor(null); }
    else if (parts[0] === 'tasks' && parts[1] && parts[2] === 'runs') { setActive('runs'); await viewRuns({ task_id: parts[1] }); }
    else if (parts[0] === 'tasks' && parts[1]) { setActive('tasks'); await viewEditor(Number(parts[1])); }
    else if (parts[0] === 'tasks') { setActive('tasks'); await viewTasks(params); }
    else if (parts[0] === 'runs' && parts[1]) { setActive('runs'); await viewRuns(Object.fromEntries(params)); openRun(Number(parts[1])); }
    else if (parts[0] === 'runs') { setActive('runs'); await viewRuns(Object.fromEntries(params)); }
    else if (parts[0] === 'emails') { setActive('emails'); await viewEmails(Object.fromEntries(params)); }
    else if (parts[0] === 'settings') { setActive('settings'); await viewSettings(); }
    else if (parts[0] === 'audit') { setActive('audit'); await viewAudit(); }
    else location.hash = '#/dashboard';
  } catch (e) {
    if (e.status !== 401) view.innerHTML = `<div class="alert alert-bad">שגיאה בטעינה: ${esc(e.message)}</div>`;
  }
}
window.addEventListener('hashchange', route);

// ---------- מודאל ----------
function openModal(title, body, foot = '') {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="btn btn-ghost icon-btn" data-close aria-label="סגירה">✕</button></div><div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
  ov.addEventListener('click', (e) => { if (e.target === ov || e.target.closest('[data-close]')) closeModal(); });
  document.body.append(ov);
  return ov;
}
function closeModal() {
  $$('.overlay').forEach((o) => o.remove());
  if (/^#\/runs\/\d+/.test(location.hash)) history.replaceState(null, '', '#/runs');
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
function confirmBox(title, text, okLabel = 'אישור', danger = false) {
  return new Promise((resolve) => {
    const ov = openModal(esc(title), `<p style="margin:0">${text}</p>`, `<button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(okLabel)}</button><button class="btn" data-close>ביטול</button>`);
    $('[data-ok]', ov).onclick = () => { closeModal(); resolve(true); };
    ov.addEventListener('click', (e) => { if (e.target === ov || e.target.closest('[data-close]')) resolve(false); });
  });
}

// ---------- לוח בקרה ----------
async function viewDashboard() {
  const load = async () => {
    const d = await api('GET', '/dashboard');
    const t = d.tasks || {};
    const r = d.runs24 || {};
    const rate = r.total ? Math.round((r.success / r.total) * 100) : null;
    const e7 = d.emails7 || {};
    const sentTotal = Object.values(e7).reduce((a, b) => a + b, 0);
    const max = Math.max(1, ...d.hourly.map((h) => h.success + h.failure));
    const alerts = [];
    if (d.paused) alerts.push(`<div class="alert alert-warn"><b>כל הריצות המתוזמנות מושהות.</b><span class="spacer"></span><button class="btn btn-sm" id="resume">חידוש ריצות</button></div>`);
    if (t.email_tasks && !d.resend_configured) alerts.push('<div class="alert alert-bad">יש משימות מייל, אבל המפתח RESEND_API_KEY לא הוגדר ב-Worker.</div>');
    if (t.failing) alerts.push(`<div class="alert alert-bad"><b>${num(t.failing)} משימות פעילות נכשלו בריצה האחרונה.</b><span class="spacer"></span><a class="btn btn-sm" href="#/tasks?status=failing">הצגה</a></div>`);
    $('#view').innerHTML = `
      <div class="page-head"><div><h1>לוח בקרה</h1><div class="sub">עודכן ${hourFmt.format(d.now)}</div></div>
        <a class="btn btn-primary" href="#/tasks/new">${icon('plus')}משימה חדשה</a></div>
      ${alerts.join('')}
      <div class="grid grid-4" style="margin-bottom:16px">
        <div class="card stat"><div class="label">משימות פעילות</div><div class="value">${num(t.enabled)}</div><div class="hint">מתוך ${num(t.total)} · ${num(t.disabled)} מושבתות</div></div>
        <div class="card stat"><div class="label">ריצות ב-24 השעות האחרונות</div><div class="value">${num(r.total)}</div><div class="hint">${num(r.success)} הצליחו · ${num(r.failure)} נכשלו</div></div>
        <div class="card stat"><div class="label">אחוז הצלחה (24 שעות)</div><div class="value" style="color:${rate == null ? 'inherit' : rate >= 95 ? 'var(--ok)' : rate >= 80 ? 'var(--warn)' : 'var(--bad)'}">${rate == null ? '—' : rate + '%'}</div><div class="hint">משך ממוצע ${dur(r.avg_ms)}</div></div>
        <div class="card stat"><div class="label">מיילים (7 ימים)</div><div class="value">${num(sentTotal)}</div><div class="hint">${num((e7.delivered || 0) + (e7.opened || 0) + (e7.clicked || 0))} נמסרו · ${num((e7.opened || 0) + (e7.clicked || 0))} נפתחו · ${num((e7.bounced || 0) + (e7.failed || 0) + (e7.complained || 0))} בעיות</div></div>
      </div>
      <div class="card card-pad" style="margin-bottom:16px">
        <div class="row"><h2 style="margin:0">ריצות לפי שעה</h2><span class="spacer"></span><div class="legend"><span><i style="background:var(--ok)"></i>הצלחה</span><span><i style="background:var(--bad)"></i>כשל</span></div></div>
        <div class="chart">${d.hourly.map((h) => `<div class="col" data-tip="${hourFmt.format(h.hour_start)} · ${h.success} הצלחות, ${h.failure} כשלים"><span class="s" style="height:${(h.success / max) * 100}%"></span><span class="f" style="height:${(h.failure / max) * 100}%"></span></div>`).join('')}</div>
        <div class="chart-axis"><span>${hourFmt.format(d.hourly[0].hour_start)}</span><span>${hourFmt.format(d.hourly[12].hour_start)}</span><span>עכשיו</span></div>
      </div>
      <div class="grid grid-2">
        <div class="card card-pad"><h2>הריצות הבאות</h2>
          ${d.upcoming.length ? `<ul class="list">${d.upcoming.map((u) => `<li><div><a href="#/tasks/${u.id}" class="cell-title">${esc(u.name)}</a> ${typePill(u.task_type)}<div class="cell-sub">${esc(u.schedule_text)}</div></div><div class="nowrap" style="text-align:end">${fmtShort(u.next_run_at)}<div class="faint small">${rel(u.next_run_at)}</div></div></li>`).join('')}</ul>` : '<div class="empty">אין משימות מתוזמנות</div>'}
        </div>
        <div class="card card-pad"><h2>כשלים אחרונים</h2>
          ${d.failures.length ? `<ul class="list">${d.failures.map((f) => `<li><div style="min-width:0"><a href="#/runs/${f.id}" class="cell-title">${esc(f.task_name)}</a><div class="cell-sub">${f.status_code ? `[${f.status_code}] ` : ''}${esc(f.error || '')}</div></div><div class="nowrap faint small">${rel(f.started_at)}</div></li>`).join('')}</ul>` : '<div class="empty">אין כשלים</div>'}
        </div>
      </div>`;
    const resume = $('#resume');
    if (resume) resume.onclick = async () => { await api('PUT', '/settings', { paused: '0' }); toast('הריצות חודשו', 'ok'); load(); };
  };
  await load();
  autoRefresh(load);
}

// ---------- משימות ----------
async function viewTasks(params) {
  const filters = { q: params.get('q') || '', status: params.get('status') || '', type: params.get('type') || '', tag: params.get('tag') || '' };
  const selected = new Set();
  $('#view').innerHTML = `
    <div class="page-head"><div><h1>משימות</h1><div class="sub" id="tasks-count"></div></div>
      <div class="row"><a class="btn" href="/api/export" download>ייצוא</a><a class="btn btn-primary" href="#/tasks/new">${icon('plus')}משימה חדשה</a></div></div>
    <div class="card" style="margin-bottom:12px"><div class="card-pad row" style="padding:12px">
      <input type="search" id="f-q" placeholder="חיפוש לפי שם, כתובת או תגית" style="max-width:320px" value="${esc(filters.q)}">
      <select id="f-status" style="width:auto"><option value="">כל המצבים</option><option value="active">פעילות</option><option value="disabled">מושבתות</option><option value="failing">נכשלות</option><option value="running">רצות כעת</option></select>
      <select id="f-type" style="width:auto"><option value="">כל הסוגים</option><option value="http">HTTP</option><option value="email">מייל</option></select>
      <select id="f-tag" style="width:auto"><option value="">כל התגיות</option></select>
      <span class="spacer"></span>
      <div class="row hidden" id="bulk"><span class="muted small" id="bulk-count"></span>
        <button class="btn btn-sm" data-bulk="enable">הפעלה</button><button class="btn btn-sm" data-bulk="disable">השבתה</button><button class="btn btn-sm btn-danger" data-bulk="delete">מחיקה</button></div>
    </div></div>
    <div class="card table-wrap" id="tasks-table"></div>`;
  $('#f-status').value = filters.status;
  $('#f-type').value = filters.type;

  const load = async () => {
    const qs = new URLSearchParams(Object.entries(filters).filter(([, v]) => v)).toString();
    const d = await api('GET', `/tasks${qs ? '?' + qs : ''}`);
    const tagSel = $('#f-tag');
    if (tagSel.options.length !== d.tags.length + 1) {
      tagSel.innerHTML = '<option value="">כל התגיות</option>' + d.tags.map((t) => `<option>${esc(t)}</option>`).join('');
      tagSel.value = filters.tag;
    }
    $('#tasks-count').textContent = d.tasks.length === d.total ? `${d.total} משימות` : `${d.tasks.length} מתוך ${d.total} משימות`;
    for (const id of [...selected]) if (!d.tasks.some((t) => t.id === id)) selected.delete(id);
    if (!d.tasks.length) {
      $('#tasks-table').innerHTML = d.total ? '<div class="empty">אין משימות שמתאימות לסינון</div>' : `<div class="empty">עדיין אין משימות.<br><br><a class="btn btn-primary" href="#/tasks/new">${icon('plus')}יצירת משימה ראשונה</a></div>`;
      updateBulk();
      return;
    }
    $('#tasks-table').innerHTML = `<table>
      <thead><tr><th style="width:32px"><input type="checkbox" id="sel-all" aria-label="בחירת הכל"></th><th>משימה</th><th>תזמון</th><th>מצב</th><th>ריצה אחרונה</th><th>ריצה הבאה</th><th></th></tr></thead>
      <tbody>${d.tasks.map((t) => `
        <tr data-id="${t.id}">
          <td><input type="checkbox" class="sel" value="${t.id}" ${selected.has(t.id) ? 'checked' : ''} aria-label="בחירה"></td>
          <td style="min-width:200px"><a class="cell-title" href="#/tasks/${t.id}">${esc(t.name)}</a> ${typePill(t.task_type)}
            <div class="cell-sub ltr" style="text-align:right">${esc(t.task_type === 'email' ? t.email_to : `${t.http_method} ${t.http_url}`)}</div>
            ${t.tags ? `<div>${t.tags.split(',').map((x) => `<span class="tag">${esc(x.trim())}</span>`).join('')}</div>` : ''}</td>
          <td class="small"><div>${esc(t.schedule_text)}</div>${t.cron_expr ? `<code class="faint ltr">${esc(t.cron_expr)}</code>` : ''}</td>
          <td>${taskBadge(t)}${t.consecutive_failures > 1 ? `<div class="faint small">${t.consecutive_failures} כשלים ברצף</div>` : ''}</td>
          <td class="small nowrap">${t.last_run_at ? `${fmtShort(t.last_run_at)}<div class="faint">${t.last_status_code ?? ''} · ${dur(t.last_duration_ms)}</div>` : '<span class="faint">טרם רצה</span>'}</td>
          <td class="small nowrap">${t.next_run_at ? `${fmtShort(t.next_run_at)}<div class="faint">${rel(t.next_run_at)}</div>` : '<span class="faint">—</span>'}</td>
          <td class="nowrap" style="text-align:end">
            <button class="btn btn-sm" data-act="run" title="הרץ עכשיו">${icon('play')}הרץ</button>
            <details class="menu"><summary class="btn btn-sm icon-btn" aria-label="פעולות נוספות">${icon('more')}</summary><div class="menu-items">
              <button data-act="edit">עריכה</button>
              <button data-act="${t.enabled ? 'disable' : 'enable'}">${t.enabled ? 'השבתה' : 'הפעלה'}</button>
              <button data-act="runs">יומן ריצות</button>
              <button data-act="duplicate">שכפול</button>
              ${t.running_since ? '<button data-act="unlock">שחרור נעילה</button>' : ''}
              <button data-act="delete" class="danger">מחיקה</button>
            </div></details>
          </td>
        </tr>`).join('')}</tbody></table>`;
    $('#sel-all').checked = d.tasks.every((t) => selected.has(t.id));
    updateBulk();
  };

  function updateBulk() {
    $('#bulk').classList.toggle('hidden', !selected.size);
    $('#bulk-count').textContent = `${selected.size} נבחרו`;
  }

  let qTimer;
  $('#f-q').addEventListener('input', (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { filters.q = e.target.value; load(); }, 250); });
  for (const k of ['status', 'type', 'tag']) $(`#f-${k}`).addEventListener('change', (e) => { filters[k] = e.target.value; load(); });

  $('#tasks-table').addEventListener('change', (e) => {
    if (e.target.id === 'sel-all') {
      $$('.sel').forEach((c) => { c.checked = e.target.checked; c.checked ? selected.add(Number(c.value)) : selected.delete(Number(c.value)); });
    } else if (e.target.classList.contains('sel')) {
      e.target.checked ? selected.add(Number(e.target.value)) : selected.delete(Number(e.target.value));
    }
    updateBulk();
  });

  $('#bulk').addEventListener('click', async (e) => {
    const action = e.target.dataset.bulk;
    if (!action) return;
    const names = { enable: 'הפעלת', disable: 'השבתת', delete: 'מחיקת' };
    if (!(await confirmBox(`${names[action]} ${selected.size} משימות`, action === 'delete' ? 'המשימות ויומן הריצות שלהן יימחקו לצמיתות.' : 'להמשיך?', 'אישור', action === 'delete'))) return;
    try {
      const r = await api('POST', '/tasks/bulk', { ids: [...selected], action });
      const bad = r.results.filter((x) => !x.ok);
      bad.length ? toast(`${bad.length} נכשלו: ${bad[0].error}`, 'bad') : toast('בוצע', 'ok');
      selected.clear();
      load();
    } catch (err) { toast(err.message, 'bad'); }
  });

  $('#tasks-table').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = Number(btn.closest('tr').dataset.id);
    const name = $('.cell-title', btn.closest('tr')).textContent;
    btn.closest('details')?.removeAttribute('open');
    const act = btn.dataset.act;
    try {
      if (act === 'edit') location.hash = `#/tasks/${id}`;
      else if (act === 'runs') location.hash = `#/tasks/${id}/runs`;
      else if (act === 'run') await runNowUI(id, btn, load);
      else if (act === 'enable' || act === 'disable') { await api('POST', `/tasks/${id}/${act}`); toast(act === 'enable' ? 'המשימה הופעלה' : 'המשימה הושבתה', 'ok'); load(); }
      else if (act === 'duplicate') { const r = await api('POST', `/tasks/${id}/duplicate`); toast('נוצר עותק מושבת', 'ok'); location.hash = `#/tasks/${r.task.id}`; }
      else if (act === 'unlock') { if (await confirmBox('שחרור נעילה', 'שחרר רק אם הריצה תקועה. ריצה שעדיין פעילה תסומן כנכשלת.', 'שחרור')) { await api('POST', `/tasks/${id}/unlock`); load(); } }
      else if (act === 'delete') {
        if (await confirmBox('מחיקת משימה', `למחוק את "${esc(name)}"? גם יומן הריצות שלה יימחק.`, 'מחיקה', true)) { await api('DELETE', `/tasks/${id}`); toast('המשימה נמחקה', 'ok'); load(); }
      }
    } catch (err) { toast(err.message, 'bad'); }
  });
  await load();
  autoRefresh(load);
}
document.addEventListener('click', (e) => { $$('details.menu[open]').forEach((d) => { if (!d.contains(e.target)) d.removeAttribute('open'); }); });

async function runNowUI(id, btn, after) {
  const orig = btn?.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> רצה...'; }
  try {
    const { run } = await api('POST', `/tasks/${id}/run`);
    if (run.status === 'success') toast(`הריצה הצליחה${run.status_code ? ` (${run.status_code})` : ''} · ${dur(run.duration_ms)}`, 'ok');
    else toast(`הריצה נכשלה: ${run.error || run.status_code}`, 'bad');
    showRun(run.id);
  } catch (err) { toast(err.message, 'bad'); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = orig; } after && after().catch(() => {}); }
}

// ---------- עורך משימה ----------
const PRESETS = [
  ['כל דקה', '* * * * *'], ['כל 5 דקות', '*/5 * * * *'], ['כל 15 דקות', '*/15 * * * *'], ['כל שעה עגולה', '0 * * * *'],
  ['כל יום ב-08:00', '0 8 * * *'], ["א'-ה' ב-09:00", '0 9 * * 0-4'], ['כל יום ראשון ב-08:00', '0 8 * * 0'],
  ['1 בכל חודש ב-10:00', '0 10 1 * *'], ['כל 10 דק\' בשעות 08-18', '*/10 8-18 * * *'],
];
const HE_DAYS_SHORT = ["א'", "ב'", "ג'", "ד'", "ה'", "ו'", "ש'"];

async function viewEditor(id) {
  let task;
  if (id) task = (await api('GET', `/tasks/${id}`)).task;
  else task = { name: '', description: '', tags: '', task_type: 'http', schedule_type: 'cron', cron_expr: '0 8 * * *', run_at_local: '', http_method: 'GET', http_url: '', http_headers: '{}', http_body: '', expect_status: '200-299', expect_body: '', email_from: '', email_to: '', email_cc: '', email_bcc: '', email_reply_to: '', email_subject: '', email_html: '', email_text: '', enabled: 1, timeout_ms: 30000, max_attempts: 3, retry_delay_ms: 2000, notify_webhook_url: '', notify_email: '' };
  if (!state.settings) state.settings = await api('GET', '/settings').catch(() => null);
  const info = state.settings || { secrets: [], variables: [], settings: {} };

  let headerRows;
  try { headerRows = Object.entries(JSON.parse(task.http_headers || '{}')).map(([k, v]) => ({ k, v })); } catch { headerRows = []; }
  let headersRaw = false;

  $('#view').innerHTML = `
    <div class="page-head"><div><h1>${id ? `עריכת משימה #${id}` : 'משימה חדשה'}</h1>${id ? `<div class="sub">${taskBadge(task)} · נוצרה ${fmt(task.created_at)} · ${num(task.total_runs)} ריצות, ${num(task.total_failures)} כשלים</div>` : ''}</div>
      <div class="row">${id ? `<a class="btn" href="#/tasks/${id}/runs">יומן ריצות</a><button class="btn" id="ed-run">${icon('play')}הרץ עכשיו</button>` : ''}</div></div>
    <form id="ed" class="editor" novalidate>
      <div class="stack">
        <div class="card card-pad">
          <h2>פרטים</h2>
          <div class="field"><label class="f" for="name">שם</label><input type="text" id="name" maxlength="200" value="${esc(task.name)}"><div class="err" data-err="name"></div></div>
          <div class="field"><label class="f" for="description">תיאור</label><input type="text" id="description" value="${esc(task.description)}"></div>
          <div class="grid grid-2">
            <div class="field"><label class="f" for="tags">תגיות</label><input type="text" id="tags" placeholder="מופרדות בפסיק" value="${esc(task.tags)}"></div>
            <div class="field"><label class="f">סוג משימה</label><div class="seg" id="type-seg"><button type="button" data-v="http">קריאת HTTP</button><button type="button" data-v="email">שליחת מייל</button></div></div>
          </div>
          <label class="check"><span class="switch"><input type="checkbox" id="enabled" ${task.enabled ? 'checked' : ''}><span></span></span> משימה פעילה</label>
        </div>

        <div class="card card-pad">
          <div class="row" style="margin-bottom:12px"><h2 style="margin:0">תזמון</h2><span class="spacer"></span>
            <div class="seg" id="sched-seg"><button type="button" data-v="cron">חוזר (cron)</button><button type="button" data-v="once">חד-פעמי</button></div></div>
          <div id="sched-cron">
            <div class="field"><label class="f" for="cron_expr">ביטוי cron</label>
              <input type="text" id="cron_expr" class="ltr mono" value="${esc(task.cron_expr || '')}" spellcheck="false" autocomplete="off">
              <div class="cron-fields"><span>דקה</span><span>שעה</span><span>יום בחודש</span><span>חודש</span><span>יום בשבוע</span></div>
              <div class="err" data-err="cron_expr"></div></div>
            <div class="field"><label class="f">תבניות מהירות</label><div class="row" style="gap:6px">${PRESETS.map(([l, e]) => `<button type="button" class="chip" data-cron="${e}">${esc(l)}</button>`).join('')}</div></div>
            <details style="margin-top:6px"><summary style="cursor:pointer;font-weight:500">בונה ביטויים</summary>
              <div style="margin-top:12px">
                <div class="row" style="margin-bottom:10px">
                  <select id="b-mode" style="width:auto"><option value="minutes">כל כמה דקות</option><option value="hourly">כל שעה</option><option value="daily">כל יום / ימים נבחרים</option><option value="monthly">פעם בחודש</option></select>
                  <span id="b-interval-wrap">כל <select id="b-interval" style="width:auto">${[1, 2, 3, 5, 10, 15, 20, 30].map((n) => `<option>${n}</option>`).join('')}</select> דקות</span>
                  <span id="b-minute-wrap">בדקה <input type="number" id="b-minute" min="0" max="59" value="0" style="width:80px"></span>
                  <span id="b-time-wrap">בשעה <input type="time" id="b-time" value="08:00" style="width:auto"></span>
                  <span id="b-dom-wrap">ביום <input type="number" id="b-dom" min="1" max="31" value="1" style="width:80px"> בחודש</span>
                </div>
                <div id="b-hours-wrap" class="row" style="margin-bottom:10px">בין השעות <select id="b-h-from" style="width:auto">${Array.from({ length: 24 }, (_, h) => `<option value="${h}">${String(h).padStart(2, '0')}:00</option>`).join('')}</select> ל-<select id="b-h-to" style="width:auto">${Array.from({ length: 24 }, (_, h) => `<option value="${h}" ${h === 23 ? 'selected' : ''}>${String(h).padStart(2, '0')}:59</option>`).join('')}</select></div>
                <div id="b-days-wrap" class="days" style="margin-bottom:10px">${HE_DAYS_SHORT.map((d, i) => `<label><input type="checkbox" value="${i}" checked>${d}</label>`).join('')}</div>
                <button type="button" class="btn btn-sm" id="b-apply">החלת הביטוי</button>
              </div>
              <table class="small" style="margin-top:14px"><tr><th>סימן</th><th>משמעות</th><th>דוגמה</th></tr>
                <tr><td><code>*</code></td><td>כל ערך</td><td><code class="ltr">* * * * *</code> כל דקה</td></tr>
                <tr><td><code>,</code></td><td>רשימה</td><td><code class="ltr">0 8,14 * * *</code> ב-08:00 וב-14:00</td></tr>
                <tr><td><code>-</code></td><td>טווח</td><td><code class="ltr">0 9 * * 0-4</code> ראשון עד חמישי</td></tr>
                <tr><td><code>/</code></td><td>צעד</td><td><code class="ltr">*/20 * * * *</code> כל 20 דקות</td></tr>
              </table>
              <div class="help">ימים בשבוע: 0 = ראשון ... 6 = שבת. כל הזמנים לפי שעון ישראל, כולל מעבר שעון קיץ/חורף.</div>
            </details>
          </div>
          <div id="sched-once">
            <div class="field"><label class="f" for="run_at_local">תאריך ושעה (שעון ישראל)</label><input type="datetime-local" id="run_at_local" value="${esc(task.run_at_local || '')}" style="max-width:280px"><div class="err" data-err="run_at_local"></div>
            <div class="help">אחרי הריצה המשימה תושבת אוטומטית.</div></div>
          </div>
        </div>

        <div class="card card-pad" id="http-card">
          <h2>בקשת HTTP</h2>
          <div class="field"><label class="f" for="http_url">כתובת</label>
            <div class="row" style="flex-wrap:nowrap"><select id="http_method" style="width:auto" class="ltr">${['GET', 'POST', 'PUT', 'PATCH', 'DELETE'].map((m) => `<option ${task.http_method === m ? 'selected' : ''}>${m}</option>`).join('')}</select>
            <input type="text" id="http_url" class="ltr mono" placeholder="https://api.example.com/endpoint" value="${esc(task.http_url)}" spellcheck="false"></div>
            <div class="err" data-err="http_url"></div></div>
          <div class="field"><div class="row" style="margin-bottom:6px"><label class="f" style="margin:0">כותרות</label><span class="spacer"></span><button type="button" class="btn btn-sm btn-ghost" id="hdr-mode">עריכה כ-JSON</button></div>
            <div id="hdr-rows"></div><textarea id="hdr-raw" class="ltr hidden" spellcheck="false"></textarea>
            <button type="button" class="btn btn-sm" id="hdr-add">${icon('plus')}כותרת</button>
            <div class="err" data-err="http_headers"></div></div>
          <div class="field" id="body-field"><div class="row" style="margin-bottom:6px"><label class="f" for="http_body" style="margin:0">גוף הבקשה</label><span class="spacer"></span><button type="button" class="btn btn-sm btn-ghost" id="fmt-json">עיצוב JSON</button></div>
            <textarea id="http_body" class="ltr" rows="6" spellcheck="false">${esc(task.http_body)}</textarea><div class="err" data-err="http_body"></div></div>
          <div class="grid grid-2">
            <div class="field"><label class="f" for="expect_status">קודי תגובה תקינים</label><input type="text" id="expect_status" class="ltr mono" value="${esc(task.expect_status)}"><div class="help">למשל 200-299,304</div><div class="err" data-err="expect_status"></div></div>
            <div class="field"><label class="f" for="expect_body">התגובה חייבת להכיל (רשות)</label><input type="text" id="expect_body" value="${esc(task.expect_body)}"></div>
          </div>
        </div>

        <div class="card card-pad" id="email-card">
          <h2>מייל (Resend)</h2>
          ${info.resend_configured === false ? '<div class="alert alert-warn">RESEND_API_KEY עדיין לא הוגדר ב-Worker.</div>' : ''}
          <div class="grid grid-2">
            <div class="field"><label class="f" for="email_from">שולח</label><input type="text" id="email_from" class="ltr" placeholder="${esc(info.settings?.default_from_email || 'Name <noreply@your-domain.com>')}" value="${esc(task.email_from)}"><div class="help">ריק = כתובת ברירת המחדל מההגדרות</div><div class="err" data-err="email_from"></div></div>
            <div class="field"><label class="f" for="email_to">נמענים</label><input type="text" id="email_to" class="ltr" placeholder="a@example.com, b@example.com" value="${esc(task.email_to)}"><div class="err" data-err="email_to"></div></div>
            <div class="field"><label class="f" for="email_cc">עותק (CC)</label><input type="text" id="email_cc" class="ltr" value="${esc(task.email_cc)}"><div class="err" data-err="email_cc"></div></div>
            <div class="field"><label class="f" for="email_bcc">עותק מוסתר (BCC)</label><input type="text" id="email_bcc" class="ltr" value="${esc(task.email_bcc)}"><div class="err" data-err="email_bcc"></div></div>
            <div class="field"><label class="f" for="email_reply_to">כתובת למענה</label><input type="text" id="email_reply_to" class="ltr" value="${esc(task.email_reply_to)}"><div class="err" data-err="email_reply_to"></div></div>
            <div class="field"><label class="f" for="email_subject">נושא</label><input type="text" id="email_subject" value="${esc(task.email_subject)}"><div class="err" data-err="email_subject"></div></div>
          </div>
          <div class="field"><div class="row" style="margin-bottom:6px"><label class="f" for="email_html" style="margin:0">תוכן HTML</label><span class="spacer"></span><button type="button" class="btn btn-sm btn-ghost" id="html-preview-btn">תצוגה מקדימה</button></div>
            <textarea id="email_html" class="ltr" rows="8" spellcheck="false">${esc(task.email_html)}</textarea>
            <iframe class="mail-preview hidden" id="html-preview" sandbox title="תצוגה מקדימה"></iframe><div class="err" data-err="email_html"></div></div>
          <div class="field"><label class="f" for="email_text">תוכן טקסט פשוט (רשות)</label><textarea id="email_text" rows="4">${esc(task.email_text)}</textarea></div>
        </div>

        <div class="card card-pad">
          <h2>ניסיונות חוזרים והתראות</h2>
          <div class="grid grid-2">
            <div class="field"><label class="f" for="max_attempts">מספר ניסיונות</label><select id="max_attempts">${[1, 2, 3, 4, 5].map((n) => `<option ${Number(task.max_attempts) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
            <div class="field"><label class="f" for="retry_delay">המתנה לפני ניסיון חוזר (שניות)</label><input type="number" id="retry_delay" min="0" max="60" value="${task.retry_delay_ms / 1000}"><div class="help" id="retry-help"></div></div>
            <div class="field"><label class="f" for="timeout">זמן המתנה מרבי לתגובה (שניות)</label><input type="number" id="timeout" min="1" max="120" value="${task.timeout_ms / 1000}"></div>
          </div>
          <div class="grid grid-2">
            <div class="field"><label class="f" for="notify_webhook_url">Webhook להתראת כשל</label><input type="text" id="notify_webhook_url" class="ltr" placeholder="${esc(info.settings?.notify_webhook_url || 'ברירת המחדל מההגדרות')}" value="${esc(task.notify_webhook_url)}"><div class="err" data-err="notify_webhook_url"></div></div>
            <div class="field"><label class="f" for="notify_email">מייל להתראת כשל</label><input type="text" id="notify_email" class="ltr" placeholder="${esc(info.settings?.notify_email || 'ברירת המחדל מההגדרות')}" value="${esc(task.notify_email)}"><div class="err" data-err="notify_email"></div></div>
          </div>
          <div class="help">התראה נשלחת כשהמשימה נכשלת סופית, אחרי כל הניסיונות. שדה ריק = הגדרות ברירת המחדל.</div>
        </div>
      </div>

      <div class="stack sticky">
        <div class="card card-pad">
          <h2>מועדי הריצה הבאים</h2>
          <div id="preview-desc" class="cron-desc"></div>
          <ul class="next-runs" id="preview-list"></ul>
        </div>
        <div class="card card-pad">
          <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
            <button class="btn btn-primary" type="submit">שמירה</button>
            <button class="btn" type="button" id="ed-preview">תצוגה מקדימה של הבקשה</button>
            <a class="btn btn-ghost" href="#/tasks">ביטול</a>
            ${id ? '<button class="btn btn-danger" type="button" id="ed-delete">מחיקת המשימה</button>' : ''}
          </div>
        </div>
        <div class="card card-pad">
          <h2>משתנים וסודות</h2>
          <div class="help" style="margin:-6px 0 10px">לחיצה מוסיפה לשדה האחרון שנבחר</div>
          <div class="var-list">${(info.variables || []).filter((v) => !v.name.startsWith('{{secret')).map((v) => `<div class="var-item" data-insert="${esc(v.name)}"><code class="ltr">${esc(v.name)}</code><div>${esc(v.desc)}</div></div>`).join('')}</div>
          <h3 style="margin-top:14px">סודות זמינים</h3>
          ${(info.secrets || []).length ? `<div class="row" style="gap:6px">${info.secrets.map((s) => `<button type="button" class="chip" data-insert="{{secret:${esc(s)}}}"><code class="ltr">${esc(s)}</code></button>`).join('')}</div>` : '<div class="help">לא הוגדרו סודות. הוסף עם <code class="ltr">wrangler secret put NAME</code></div>'}
        </div>
      </div>
    </form>`;

  const form = $('#ed');
  let type = task.task_type;
  let sched = task.schedule_type;
  let lastFocus = null;
  form.addEventListener('focusin', (e) => { if (e.target.matches('input[type=text], textarea')) lastFocus = e.target; });

  const setSeg = (segId, val) => $$(`#${segId} button`).forEach((b) => b.classList.toggle('on', b.dataset.v === val));
  function applyType() {
    setSeg('type-seg', type);
    $('#http-card').classList.toggle('hidden', type !== 'http');
    $('#email-card').classList.toggle('hidden', type !== 'email');
  }
  function applySched() {
    setSeg('sched-seg', sched);
    $('#sched-cron').classList.toggle('hidden', sched !== 'cron');
    $('#sched-once').classList.toggle('hidden', sched !== 'once');
    updatePreview();
  }
  $('#type-seg').onclick = (e) => { if (e.target.dataset.v) { type = e.target.dataset.v; applyType(); } };
  $('#sched-seg').onclick = (e) => { if (e.target.dataset.v) { sched = e.target.dataset.v; applySched(); } };
  const applyMethod = () => $('#body-field').classList.toggle('hidden', $('#http_method').value === 'GET');
  $('#http_method').onchange = applyMethod;

  // כותרות
  function renderHeaders() {
    $('#hdr-rows').innerHTML = headerRows.map((r, i) => `<div class="kv" data-i="${i}"><input type="text" class="ltr mono" placeholder="Header-Name" value="${esc(r.k)}" data-k><input type="text" class="ltr mono" placeholder="value או {{secret:NAME}}" value="${esc(r.v)}" data-v><button type="button" class="btn btn-sm btn-ghost" data-del aria-label="הסרה">✕</button></div>`).join('');
  }
  $('#hdr-rows').addEventListener('input', (e) => {
    const row = e.target.closest('.kv');
    if (!row) return;
    const r = headerRows[row.dataset.i];
    if (e.target.hasAttribute('data-k')) r.k = e.target.value; else r.v = e.target.value;
  });
  $('#hdr-rows').addEventListener('click', (e) => { if (e.target.closest('[data-del]')) { headerRows.splice(e.target.closest('.kv').dataset.i, 1); renderHeaders(); } });
  $('#hdr-add').onclick = () => { headerRows.push({ k: '', v: '' }); renderHeaders(); $$('#hdr-rows [data-k]').pop()?.focus(); };
  const headersJson = () => headersRaw ? $('#hdr-raw').value : JSON.stringify(Object.fromEntries(headerRows.filter((r) => r.k.trim()).map((r) => [r.k.trim(), r.v])), null, 2);
  $('#hdr-mode').onclick = () => {
    if (!headersRaw) {
      $('#hdr-raw').value = headersJson();
      headersRaw = true;
    } else {
      try { headerRows = Object.entries(JSON.parse($('#hdr-raw').value || '{}')).map(([k, v]) => ({ k, v: String(v) })); }
      catch { toast('JSON לא תקין', 'bad'); return; }
      headersRaw = false;
      renderHeaders();
    }
    $('#hdr-raw').classList.toggle('hidden', !headersRaw);
    $('#hdr-rows').classList.toggle('hidden', headersRaw);
    $('#hdr-add').classList.toggle('hidden', headersRaw);
    $('#hdr-mode').textContent = headersRaw ? 'עריכה כטבלה' : 'עריכה כ-JSON';
  };
  $('#fmt-json').onclick = () => {
    try { $('#http_body').value = JSON.stringify(JSON.parse($('#http_body').value), null, 2); } catch { toast('הגוף אינו JSON תקין', 'bad'); }
  };

  // תצוגה מקדימה של HTML
  $('#html-preview-btn').onclick = () => {
    const fr = $('#html-preview');
    const show = fr.classList.contains('hidden');
    fr.classList.toggle('hidden', !show);
    if (show) fr.srcdoc = $('#email_html').value;
  };
  $('#email_html').addEventListener('input', () => { const fr = $('#html-preview'); if (!fr.classList.contains('hidden')) fr.srcdoc = $('#email_html').value; });

  // הוספת משתנים
  form.addEventListener('click', (e) => {
    const el = e.target.closest('[data-insert]');
    if (!el) return;
    const text = el.dataset.insert;
    if (lastFocus && document.body.contains(lastFocus)) {
      const s = lastFocus.selectionStart ?? lastFocus.value.length;
      lastFocus.value = lastFocus.value.slice(0, s) + text + lastFocus.value.slice(lastFocus.selectionEnd ?? s);
      lastFocus.focus();
      lastFocus.setSelectionRange(s + text.length, s + text.length);
      lastFocus.dispatchEvent(new Event('input', { bubbles: true }));
    } else {
      navigator.clipboard?.writeText(text);
      toast(`הועתק: ${text}`);
    }
  });

  // ניסיונות חוזרים
  const retryHelp = () => {
    const n = Number($('#max_attempts').value);
    const base = Number($('#retry_delay').value) || 0;
    $('#retry-help').textContent = n > 1 ? `המתנות: ${Array.from({ length: n - 1 }, (_, i) => base * 2 ** i + ' ש\'').join(', ')}` : 'ללא ניסיונות חוזרים';
  };
  $('#max_attempts').onchange = retryHelp;
  $('#retry_delay').oninput = retryHelp;

  // תצוגת מועדים
  let pvTimer;
  async function updatePreview() {
    clearTimeout(pvTimer);
    pvTimer = setTimeout(async () => {
      const desc = $('#preview-desc');
      const list = $('#preview-list');
      if (!desc || !list) return; // המשתמש כבר עזב את העורך
      if (sched === 'once') {
        const v = $('#run_at_local').value;
        desc.textContent = 'ריצה חד-פעמית';
        list.innerHTML = v ? `<li><span>${esc(v.replace('T', ' '))}</span></li>` : '<li class="faint">בחר תאריך ושעה</li>';
        return;
      }
      const expr = $('#cron_expr').value.trim();
      if (!expr) { desc.textContent = ''; list.innerHTML = ''; return; }
      try {
        const r = await api('GET', `/cron/preview?expr=${encodeURIComponent(expr)}`);
        $('#cron_expr').classList.toggle('invalid', !r.ok);
        $('[data-err=cron_expr]').textContent = r.ok ? '' : r.error;
        if (!r.ok) { desc.textContent = ''; list.innerHTML = `<li class="err">${esc(r.error)}</li>`; return; }
        desc.textContent = r.description;
        list.innerHTML = r.next.map((n) => `<li><span>${dayFmt.format(n.ms)}, ${fmtShort(n.ms)}</span><span class="faint small">${rel(n.ms)}</span></li>`).join('');
      } catch {}
    }, 250);
  }
  $('#cron_expr').addEventListener('input', updatePreview);
  $('#run_at_local').addEventListener('input', updatePreview);
  $$('[data-cron]').forEach((b) => (b.onclick = () => { $('#cron_expr').value = b.dataset.cron; updatePreview(); }));

  // בונה cron
  function builderVisibility() {
    const m = $('#b-mode').value;
    $('#b-interval-wrap').classList.toggle('hidden', m !== 'minutes');
    $('#b-hours-wrap').classList.toggle('hidden', m !== 'minutes' && m !== 'hourly');
    $('#b-minute-wrap').classList.toggle('hidden', m !== 'hourly');
    $('#b-time-wrap').classList.toggle('hidden', m !== 'daily' && m !== 'monthly');
    $('#b-dom-wrap').classList.toggle('hidden', m !== 'monthly');
    $('#b-days-wrap').classList.toggle('hidden', m === 'monthly');
  }
  function compress(nums) {
    if (nums.length === 7) return '*';
    const out = [];
    for (let i = 0; i < nums.length; i++) {
      let j = i;
      while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
      out.push(j - i >= 2 ? `${nums[i]}-${nums[j]}` : nums.slice(i, j + 1).join(','));
      i = j;
    }
    return out.join(',');
  }
  $('#b-mode').onchange = builderVisibility;
  $('#b-apply').onclick = () => {
    const m = $('#b-mode').value;
    const days = $$('#b-days-wrap input:checked').map((c) => Number(c.value));
    if (m !== 'monthly' && !days.length) { toast('יש לבחור לפחות יום אחד', 'bad'); return; }
    const dow = compress(days);
    const hf = Number($('#b-h-from').value), ht = Number($('#b-h-to').value);
    const hours = hf === 0 && ht === 23 ? '*' : hf <= ht ? `${hf}-${ht}` : null;
    if (!hours) { toast('טווח השעות לא תקין', 'bad'); return; }
    const [hh, mm] = ($('#b-time').value || '08:00').split(':').map(Number);
    let expr;
    if (m === 'minutes') { const n = Number($('#b-interval').value); expr = `${n === 1 ? '*' : '*/' + n} ${hours} * * ${dow}`; }
    else if (m === 'hourly') expr = `${Number($('#b-minute').value) || 0} ${hours} * * ${dow}`;
    else if (m === 'daily') expr = `${mm} ${hh} * * ${dow}`;
    else expr = `${mm} ${hh} ${Number($('#b-dom').value) || 1} * *`;
    $('#cron_expr').value = expr;
    updatePreview();
  };

  function collect() {
    return {
      name: $('#name').value, description: $('#description').value, tags: $('#tags').value,
      task_type: type, schedule_type: sched, enabled: $('#enabled').checked,
      cron_expr: $('#cron_expr').value, run_at_local: $('#run_at_local').value,
      http_method: $('#http_method').value, http_url: $('#http_url').value, http_headers: headersJson(), http_body: $('#http_body').value,
      expect_status: $('#expect_status').value, expect_body: $('#expect_body').value,
      email_from: $('#email_from').value, email_to: $('#email_to').value, email_cc: $('#email_cc').value, email_bcc: $('#email_bcc').value,
      email_reply_to: $('#email_reply_to').value, email_subject: $('#email_subject').value, email_html: $('#email_html').value, email_text: $('#email_text').value,
      max_attempts: Number($('#max_attempts').value), retry_delay_ms: Math.round(Number($('#retry_delay').value) * 1000), timeout_ms: Math.round(Number($('#timeout').value) * 1000),
      notify_webhook_url: $('#notify_webhook_url').value, notify_email: $('#notify_email').value,
    };
  }
  function showErrors(fields = {}) {
    $$('[data-err]', form).forEach((el) => { el.textContent = fields[el.dataset.err] || ''; });
    $$('.invalid', form).forEach((el) => el.classList.remove('invalid'));
    for (const k of Object.keys(fields)) {
      const input = k === 'http_headers' ? (headersRaw ? $('#hdr-raw') : null) : $(`#${k}`);
      input?.classList.add('invalid');
    }
    const first = $$('[data-err]', form).find((el) => el.textContent);
    first?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('button[type=submit]', form);
    btn.disabled = true;
    try {
      const body = collect();
      const r = id ? await api('PUT', `/tasks/${id}`, body) : await api('POST', '/tasks', body);
      toast('המשימה נשמרה', 'ok');
      state.settings = null;
      if (!id) location.hash = `#/tasks/${r.task.id}`;
      else { showErrors(); route(); }
    } catch (err) {
      if (err.data?.fields) showErrors(err.data.fields);
      toast(err.message, 'bad');
    } finally { btn.disabled = false; }
  });

  $('#ed-preview').onclick = async () => {
    try {
      const r = await api('POST', '/tasks/preview', { ...collect(), id });
      showErrors();
      let body;
      if (r.type === 'http') {
        const q = r.request;
        body = `<pre class="box">${esc(`${q.method} ${q.url}\n${Object.entries(q.headers).map(([k, v]) => `${k}: ${v}`).join('\n')}${q.body ? `\n\n${q.body}` : ''}`)}</pre>`;
      } else {
        const m = r.email;
        body = `<dl class="kvlist"><dt>שולח</dt><dd class="ltr">${esc(m.from)}</dd><dt>אל</dt><dd class="ltr">${esc(m.to.join(', '))}</dd>${m.cc.length ? `<dt>CC</dt><dd class="ltr">${esc(m.cc.join(', '))}</dd>` : ''}${m.bcc.length ? `<dt>BCC</dt><dd class="ltr">${esc(m.bcc.join(', '))}</dd>` : ''}<dt>נושא</dt><dd>${esc(m.subject)}</dd></dl>
          ${m.html ? '<iframe class="mail-preview" sandbox id="pv-frame" style="margin-top:12px"></iframe>' : ''}${m.text ? `<pre class="box" style="margin-top:12px">${esc(m.text)}</pre>` : ''}`;
      }
      const ov = openModal('תצוגה מקדימה', `<div class="help" style="margin-bottom:10px">המשתנים הוחלפו בערכים לדוגמה. ערכי סודות מוסתרים.</div>${body}`);
      const fr = $('#pv-frame', ov);
      if (fr) fr.srcdoc = r.email.html;
    } catch (err) {
      if (err.data?.fields) showErrors(err.data.fields);
      toast(err.message, 'bad');
    }
  };
  if (id) {
    $('#ed-run').onclick = (e) => runNowUI(id, e.currentTarget);
    $('#ed-delete').onclick = async () => {
      if (await confirmBox('מחיקת משימה', `למחוק את "${esc(task.name)}"? גם יומן הריצות שלה יימחק.`, 'מחיקה', true)) {
        await api('DELETE', `/tasks/${id}`);
        toast('המשימה נמחקה', 'ok');
        location.hash = '#/tasks';
      }
    };
  }

  renderHeaders();
  applyType();
  applySched();
  applyMethod();
  builderVisibility();
  retryHelp();
}

    <td class="nowrap small">${dur(r.duration_ms)}</td><td class="small">${r.attempts}</td>
    <td class="hide-sm"><div class="cell-sub" style="max-width:340px">${esc(r.error || r.response_snippet || '')}</div></td></tr>`;
  async function load(append = false) {
    const qs = new URLSearchParams(Object.entries(filters).filter(([, v]) => v));
    if (append && lastId) qs.set('before_id', lastId);
    const d = await api('GET', `/runs?${qs}`);

}

        <h2>מצב המערכת</h2>
        <label class="check"><span class="switch"><input type="checkbox" id="s-active" ${s.paused === '1' ? '' : 'checked'}><span></span></span> ריצות מתוזמנות פעילות</label>
        <div class="help">כיבוי משהה את כל הריצות המתוזמנות. "הרץ עכשיו" ממשיך לעבוד.</div>
      </div>
      <div class="card card-pad">
        <h2>התראות על כשל (ברירת מחדל)</h2>
        <div class="grid grid-2">
          <div class="field"><label class="f" for="s-webhook">כתובת Webhook</label><input type="text" id="s-webhook" class="ltr" value="${esc(s.notify_webhook_url)}" placeholder="https://hooks.slack.com/..."><div class="err" data-err="notify_webhook_url"></div><div class="help">נשלח POST עם JSON. השדות text/content מתאימים ל-Slack ול-Discord.</div></div>
          <div class="field"><label class="f" for="s-nemail">כתובות מייל</label><input type="text" id="s-nemail" class="ltr" value="${esc(s.notify_email)}"><div class="err" data-err="notify_email"></div><div class="help">נדרשים Resend וכתובת שולח</div></div>
          <div class="field"><label class="f" for="s-mode">מתי לשלוח</label><select id="s-mode"><option value="every">על כל כשל סופי</option><option value="first">רק על הכשל הראשון ברצף</option></select></div>
          <div class="field"><label class="f">&nbsp;</label><label class="check"><input type="checkbox" id="s-recovery" ${s.notify_on_recovery === '1' ? 'checked' : ''}> הודעה גם כשמשימה חוזרת לפעול</label></div>
        </div>
      </div>
      <div class="card card-pad">
        <h2>מיילים (Resend)</h2>
        <dl class="kvlist" style="margin-bottom:14px">
          <dt>מפתח API</dt><dd>${info.resend_configured ? badge(['מוגדר', 'b-ok']) : badge(['לא מוגדר', 'b-bad'])} <code class="ltr faint">RESEND_API_KEY</code></dd>
          <dt>מעקב מסירה</dt><dd>${info.webhook_configured ? badge(['מוגדר', 'b-ok']) : badge(['לא מוגדר', 'b-warn'])} <code class="ltr faint">RESEND_WEBHOOK_SECRET</code></dd>
        </dl>
        <div class="field"><label class="f" for="s-from">כתובת שולח ברירת מחדל</label><input type="text" id="s-from" class="ltr" value="${esc(s.default_from_email)}" placeholder="מערכת <noreply@your-domain.com>"><div class="err" data-err="default_from_email"></div><div class="help">חייבת להיות מדומיין שאומת ב-Resend</div></div>
        <div class="field"><label class="f">כתובת ה-Webhook להגדרה ב-Resend</label>
          <div class="row" style="flex-wrap:nowrap"><input type="text" readonly class="ltr mono" value="${esc(info.resend_webhook_url)}" id="s-wh-url"><button type="button" class="btn" id="copy-wh">העתקה</button></div>
          <div class="help">ב-Resend: Webhooks ← Add Endpoint ← הדבק את הכתובת ובחר את כל אירועי email.*. את ה-Signing Secret שמור עם <code class="ltr">wrangler secret put RESEND_WEBHOOK_SECRET</code>.</div></div>
      </div>
      <div class="card card-pad">
        <h2>סודות זמינים למשימות</h2>
        ${info.secrets.length ? `<div class="row" style="gap:6px">${info.secrets.map((n) => `<button type="button" class="chip" data-copy="{{secret:${esc(n)}}}"><code class="ltr">{{secret:${esc(n)}}}</code></button>`).join('')}</div>` : '<div class="faint">לא הוגדרו סודות</div>'}
        <div class="help" style="margin-top:8px">מוצגים רק שמות. הערכים לא נשמרים במסד ולא מוצגים בממשק. להוספת סוד: <code class="ltr">npx wrangler secret put MY_API_KEY</code></div>
      </div>
      <div class="card card-pad">
        <h2>תחזוקה</h2>
        <div class="grid grid-2">
          <div class="field"><label class="f" for="s-ret">שמירת יומן ריצות ומיילים (ימים)</label><input type="number" id="s-ret" min="1" max="365" value="${esc(s.retention_days)}"></div>
          <div class="field"><label class="f" for="s-max">מקסימום משימות שמתחילות באותה דקה</label><input type="number" id="s-max" min="1" max="100" value="${esc(s.max_tasks_per_tick)}"></div>
          <div class="field"><label class="f" for="s-lock">שחרור נעילה תקועה אחרי (דקות)</label><input type="number" id="s-lock" min="2" max="60" value="${esc(s.lock_timeout_minutes)}"></div>
          <div class="field"><label class="f" for="s-url">כתובת הממשק (לקישורים בהתראות)</label><input type="text" id="s-url" class="ltr" value="${esc(s.public_url)}"><div class="err" data-err="public_url"></div></div>
        </div>
      </div>
      <div><button class="btn btn-primary" type="submit">שמירת הגדרות</button></div>
      <div class="card card-pad">
        <h2>גיבוי ושחזור משימות</h2>
        <div class="row"><a class="btn" href="/api/export" download>ייצוא כל המשימות (JSON)</a>
          <label class="btn">ייבוא מקובץ<input type="file" id="import-file" accept="application/json,.json" class="hidden"></label></div>
        <div class="help">ייבוא מוסיף משימות חדשות ולא דורס משימות קיימות. משימה חד-פעמית שמועדה עבר מיובאת מושבתת.</div>
      </div>
    </form>`;
  $('#s-mode').value = s.notify_mode;
  $('#copy-wh').onclick = () => { navigator.clipboard?.writeText($('#s-wh-url').value); toast('הכתובת הועתקה'); };
  $$('[data-copy]').forEach((b) => (b.onclick = () => { navigator.clipboard?.writeText(b.dataset.copy); toast(`הועתק: ${b.dataset.copy}`); }));
  $('#settings-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      paused: $('#s-active').checked ? '0' : '1', notify_webhook_url: $('#s-webhook').value, notify_email: $('#s-nemail').value,
      notify_mode: $('#s-mode').value, notify_on_recovery: $('#s-recovery').checked ? '1' : '0', default_from_email: $('#s-from').value,
      retention_days: $('#s-ret').value, max_tasks_per_tick: $('#s-max').value, lock_timeout_minutes: $('#s-lock').value, public_url: $('#s-url').value,
    };
    try {
      state.settings = await api('PUT', '/settings', body);
      $$('[data-err]').forEach((el) => (el.textContent = ''));
      toast('ההגדרות נשמרו', 'ok');
    } catch (err) {
      for (const [k, v] of Object.entries(err.data?.fields || {})) { const el = $(`[data-err=${k}]`); if (el) el.textContent = v; }
      toast(err.message, 'bad');
    }
  });
  $('#import-file').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const count = (Array.isArray(data) ? data : data.tasks || []).length;
      if (!(await confirmBox('ייבוא משימות', `לייבא ${count} משימות?`, 'ייבוא'))) return;
      const r = await api('POST', '/import', data);
      toast(`יובאו ${r.created} משימות${r.failed.length ? `, ${r.failed.length} נכשלו` : ''}`, r.failed.length ? 'bad' : 'ok');
      if (r.failed.length) openModal('שגיאות בייבוא', `<pre class="box">${esc(JSON.stringify(r.failed, null, 2))}</pre>`);
    } catch (err) { toast(err instanceof SyntaxError ? 'קובץ JSON לא תקין' : err.message, 'bad'); }
    e.target.value = '';
  };
}

// ---------- יומן פעולות ----------
const AUDIT_LABEL = {
  'task.create': 'יצירת משימה', 'task.update': 'עדכון משימה', 'task.delete': 'מחיקת משימה', 'task.enable': 'הפעלת משימה', 'task.disable': 'השבתת משימה',
  'task.run_now': 'הרצה ידנית', 'task.duplicate': 'שכפול משימה', 'task.unlock': 'שחרור נעילה', 'settings.update': 'עדכון הגדרות',
  'tasks.export': 'ייצוא משימות', 'tasks.import': 'ייבוא משימות', 'email.send': 'שליחת מייל ידנית', 'login.success': 'כניסה', 'login.failure': 'ניסיון כניסה כושל',
};
async function viewAudit() {
  $('#view').innerHTML = `<div class="page-head"><div><h1>יומן פעולות</h1><div class="sub">פעולות ניהול מ-90 הימים האחרונים</div></div></div>
    <div class="card table-wrap"><table><thead><tr><th>זמן</th><th>פעולה</th><th>משימה</th><th>פרטים</th><th class="hide-sm">IP</th></tr></thead><tbody id="audit-body"></tbody></table><div class="empty hidden" id="audit-empty">אין רשומות</div></div>
    <div style="text-align:center;margin-top:12px"><button class="btn hidden" id="audit-more">טעינה נוספת</button></div>`;
  let lastId = null;
  async function load() {
    const d = await api('GET', `/audit${lastId ? `?before_id=${lastId}` : ''}`);
    $('#audit-body').innerHTML += d.entries.map((a) => `<tr><td class="nowrap small">${fmt(a.at)}</td><td>${esc(AUDIT_LABEL[a.action] || a.action)}</td><td>${a.task_id ? `<a href="#/tasks/${a.task_id}">#${a.task_id}</a>` : ''}</td><td class="small">${esc(a.details || '')}</td><td class="small faint mono hide-sm">${esc(a.ip || '')}</td></tr>`).join('');
    if (d.entries.length) lastId = d.entries[d.entries.length - 1].id;
    $('#audit-empty').classList.toggle('hidden', !!$('#audit-body').children.length);
    $('#audit-more').classList.toggle('hidden', !d.has_more);
  }
  $('#audit-more').onclick = load;
  await load();
}

// ---------- הפעלה ----------
(async () => {
  try {
    await api('GET', '/me');
    renderShell();
    route();
  } catch (e) {
    if (e.status !== 401) $('#root').innerHTML = `<div class="login"><div class="alert alert-bad">שגיאה: ${esc(e.message)}</div></div>`;
  }
})();
</script>
</body>
</html>
